[workspace]
resolver = "2"
members = [
    "crates/dtfs-common",
    "crates/dtfs-proto",
    "crates/dtfs-raft",
    "crates/dtfs-manager",
    "crates/dtfs-data",
    "crates/dtfs-client",
    "crates/dtfs-fuse",
    "crates/dtfs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/leduc/dtfs2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.13"
tonic-build = "0.13"
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"

# Consensus
openraft = { version = "0.10.0-alpha.17", features = ["serde"] }

# Storage
rocksdb = "0.22"

# HTTP / WebUI
axum = { version = "0.8", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
http-body = "1"
http-body-util = "0.1"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = "0.13"
rustls-pemfile = "2"

# Hashing / Checksums
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Metrics
prometheus-client = "0.23"

# Tracing / Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
dashmap = "6"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = "9"
bcrypt = "0.16"
rust-embed = "8"
tokio-stream = "0.1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Internal crates
dtfs-common = { path = "crates/dtfs-common" }
dtfs-proto = { path = "crates/dtfs-proto" }
dtfs-raft = { path = "crates/dtfs-raft" }
dtfs-client = { path = "crates/dtfs-client" }
