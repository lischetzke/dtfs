[workspace]
resolver = "2"
members = [
    "crates/dtfs-common",
    "crates/dtfs-proto",
    "crates/dtfs-raft",
    "crates/dtfs-manager",
    "crates/dtfs-data",
    "crates/dtfs-client",
    "crates/dtfs-fuse",
    "crates/dtfs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/lischetzke/dtfs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC (CF-6: tls-ring enables rustls-backed mTLS in tonic's transport)
tonic = { version = "0.13", features = ["tls-ring"] }
tonic-build = "0.13"
prost = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"

# Consensus
openraft = { version = "0.10.0-alpha.17", features = ["serde"] }

# Storage
rocksdb = "0.22"

# HTTP / WebUI
axum = { version = "0.8", features = ["tokio"] }
tower = "0.5"
http-body-util = "0.1"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
# CF-6: x509-parser lets generate_node_cert reconstruct the issuer from the
# real CA cert PEM so the node cert's issuer DN matches the trust anchor.
rcgen = { version = "0.13", features = ["x509-parser"] }

# Hashing / Checksums
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Metrics

# Tracing / Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
tokio-stream = "0.1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Internal crates
dtfs-common = { path = "crates/dtfs-common" }
dtfs-proto = { path = "crates/dtfs-proto" }
dtfs-raft = { path = "crates/dtfs-raft" }
dtfs-client = { path = "crates/dtfs-client" }
