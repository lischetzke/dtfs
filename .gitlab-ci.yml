# DTFS GitLab pipeline — runs on the builder host (shell executor, tag
# `dtfs-builder`; Rust toolchain + protoc/clang/libfuse3-dev, Ansible,
# curl, jq and git-cliff installed on the host).
#
# What a commit on the default branch does, decided by the FIRST word of
# its subject line (scripts/ci/version.sh):
#
#   release vX.Y.Z ...   test -> build vX.Y.Z -> GitLab release + tag -> deploy -> verify
#   deploy ...           test -> build v<base>_<YYYYMMDDHHmm> (alpha) -> release -> deploy -> verify
#   anything else        test only; nothing is built, released or deployed
#
# A pipeline started by hand (Run pipeline) can force the same paths with
# DTFS_DEPLOY_MODE=release|deploy (+ DTFS_RELEASE_VERSION=vX.Y.Z for release).
# Job `rules:` are evaluated when the pipeline is created, before any job
# runs, so the keyword gate below is a regex on CI_COMMIT_MESSAGE (`^`
# anchors at the first line); scripts/ci/version.sh then computes the
# exact VERSION for the jobs that run.
# Keyword commits on other branches build and test but never release or
# deploy. Tag pipelines are disabled: the release job creates the tag and
# that push must not start a second pipeline.
#
# Project CI/CD variables the deploy needs (Settings > CI/CD > Variables):
#   DTFS_ANSIBLE_INVENTORY   path ON THE RUNNER to the production inventory
#                            (shape: deploy/ansible/inventory.example.yml);
#                            it holds real hosts, so it lives outside git.
#   DTFS_MANAGER_API_URLS    comma list of manager REST endpoints for the
#                            verify stage, e.g. "mgr01:9402,mgr02:9402,mgr03:9402".
#   DTFS_RESTART_DELAY_SECS  optional, default 30: pause between node restarts.
#   DTFS_HEALTH_TIMEOUT_SECS optional, default 300: per-node and final
#                            health-wait budget.
#   DTFS_CI_TARGET_DIR       optional: persistent cargo target dir on the
#                            builder so builds are incremental across pipelines.
# The runner user needs SSH access as root to every cluster host (key in
# the inventory's ansible_ssh_private_key_file); nothing runs via sudo.

stages:
  - prepare
  - test
  - build
  - release
  - deploy
  - verify

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

# Keyword gate shared by build/release/deploy/verify (see header).
.keyword_commit: &keyword_commit
  - if: $DTFS_DEPLOY_MODE == "release" || $DTFS_DEPLOY_MODE == "deploy"
    when: on_success
  - if: $CI_COMMIT_MESSAGE =~ /^(release|deploy)(:|\s|$)/i
    when: on_success
  - when: never

.keyword_commit_default_branch: &keyword_commit_default_branch
  - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    when: never
  - if: $DTFS_DEPLOY_MODE == "release" || $DTFS_DEPLOY_MODE == "deploy"
    when: on_success
  - if: $CI_COMMIT_MESSAGE =~ /^(release|deploy)(:|\s|$)/i
    when: on_success
  - when: never

variables:
  GIT_DEPTH: "0"            # full history: base tag + git-cliff notes
  GIT_STRATEGY: fetch
  CARGO_TERM_COLOR: always
  DIST_DIR: dist

default:
  tags:
    - dtfs-builder
  before_script:
    - export CARGO_TARGET_DIR="${DTFS_CI_TARGET_DIR:-$CI_PROJECT_DIR/target}"
    - export PATH="$HOME/.cargo/bin:$PATH"

# ---------------------------------------------------------------------------
# prepare: decide MODE + VERSION once; every later job reads build.env.
# ---------------------------------------------------------------------------
prepare:
  stage: prepare
  script:
    - git fetch --tags --force --quiet
    - BASE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
    - STAMP="$(date -u +%Y%m%d%H%M)"
    - SUBJECT="$(printf '%s' "$CI_COMMIT_MESSAGE" | head -n1)"
    - |
      if [ -n "${DTFS_DEPLOY_MODE:-}" ]; then
        case "$DTFS_DEPLOY_MODE" in
          release) SUBJECT="release ${DTFS_RELEASE_VERSION:?DTFS_RELEASE_VERSION required for DTFS_DEPLOY_MODE=release}" ;;
          deploy)  SUBJECT="deploy (manual)" ;;
          *) echo "DTFS_DEPLOY_MODE must be release or deploy"; exit 3 ;;
        esac
      fi
    - bash scripts/ci/version.sh "$SUBJECT" "${BASE:-v0.0.0}" "$STAMP" | tee build.env
    - . ./build.env
    - |
      if [ "$MODE" = "release" ] && git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
        echo "release $VERSION already exists as a tag; bump the version in the commit subject"; exit 1
      fi
    - |
      if [ "$MODE" != "none" ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        echo "keyword commit on branch $CI_COMMIT_BRANCH: building only, release/deploy run from $CI_DEFAULT_BRANCH"
      fi
    - echo "MODE=$MODE VERSION=$VERSION (base $BASE)"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week

# ---------------------------------------------------------------------------
# test: the crate suite (CLAUDE.md A.4) plus the shell/CI helpers and an
# Ansible syntax check. Runs on every commit.
# ---------------------------------------------------------------------------
test:rust:
  stage: test
  needs: [prepare]
  script:
    - cargo --version && rustc --version
    - cargo test --workspace --release

test:scripts:
  stage: test
  needs: [prepare]
  script:
    - for f in scripts/*.sh scripts/ci/*.sh scripts/tests/*.sh; do bash -n "$f"; done
    - bash scripts/tests/test-ci-version.sh
    - bash scripts/dtfs-cluster-healthcheck.sh --help >/dev/null
    - ansible-playbook --version
    - ansible-playbook -i deploy/ansible/inventory.example.yml --syntax-check deploy/ansible/update-cluster.yml

# ---------------------------------------------------------------------------
# build: version-stamped binaries + tarball + checksums + git-cliff notes
# via the release wrapper (CLAUDE.md A.3.5). Only for keyword commits.
# ---------------------------------------------------------------------------
build:
  stage: build
  needs: [prepare, test:rust, test:scripts]
  rules: *keyword_commit
  script:
    - test "$MODE" != "none" || { echo "MODE=none: nothing to build"; exit 1; }
    - bash scripts/dtfs-release.sh "$VERSION"
    - rm -rf "$DIST_DIR" && mkdir -p "$DIST_DIR"
    - cp "target/release-artifacts/$VERSION"/* "$DIST_DIR"/
    - ls -l "$DIST_DIR"
  artifacts:
    name: "dtfs-$VERSION"
    paths:
      - dist/
    expire_in: 4 weeks

# ---------------------------------------------------------------------------
# release: Generic Package Registry upload + GitLab release (creates the
# tag). Alpha builds are marked as pre-release in the description.
# ---------------------------------------------------------------------------
release:
  stage: release
  needs: [prepare, build]
  rules: *keyword_commit_default_branch
  script:
    - |
      if [ "$MODE" = "deploy" ]; then
        bash scripts/ci/gitlab-release.sh "$VERSION" "$DIST_DIR" --prerelease
      else
        bash scripts/ci/gitlab-release.sh "$VERSION" "$DIST_DIR"
      fi

# ---------------------------------------------------------------------------
# deploy: rolling update of the whole cluster in the documented order
# (managers: learners -> follower voters -> leader; then data nodes; then
# FUSE clients), one node at a time with a health wait and a delay.
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  needs: [prepare, build, release]
  rules: *keyword_commit_default_branch
  resource_group: cluster
  environment:
    name: cluster
  script:
    - test -n "${DTFS_ANSIBLE_INVENTORY:-}" || { echo "DTFS_ANSIBLE_INVENTORY is not set"; exit 3; }
    - test -f "$DTFS_ANSIBLE_INVENTORY" || { echo "inventory $DTFS_ANSIBLE_INVENTORY not found on the runner"; exit 3; }
    - export ANSIBLE_CONFIG="$CI_PROJECT_DIR/deploy/ansible/ansible.cfg"
    - >
      ansible-playbook -i "$DTFS_ANSIBLE_INVENTORY" deploy/ansible/update-cluster.yml
      -e dtfs_tarball="$CI_PROJECT_DIR/$DIST_DIR/dtfs-linux-amd64.tar.gz"
      -e dtfs_version="$VERSION"
      -e dtfs_restart_delay_secs="${DTFS_RESTART_DELAY_SECS:-30}"
      -e dtfs_health_timeout_secs="${DTFS_HEALTH_TIMEOUT_SECS:-300}"

# ---------------------------------------------------------------------------
# verify: post-deploy cluster health from the runner, independent of the
# playbook's own per-node waits.
# ---------------------------------------------------------------------------
verify:
  stage: verify
  needs: [prepare, deploy]
  rules: *keyword_commit_default_branch
  script:
    - test -n "${DTFS_MANAGER_API_URLS:-}" || { echo "DTFS_MANAGER_API_URLS is not set"; exit 3; }
    - >
      bash scripts/dtfs-cluster-healthcheck.sh
      --managers "$DTFS_MANAGER_API_URLS"
      --expect-version "$VERSION"
      --timeout "${DTFS_HEALTH_TIMEOUT_SECS:-300}"
