[package]
name = "dtfs-fuse"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dtfs-fuse"
path = "src/main.rs"

[dependencies]
dtfs-common = { workspace = true }
dtfs-client = { workspace = true }
dtfs-proto = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# CO-4-16: classify cluster errors by gRPC status code (NotFound -> ENOENT,
# everything else transient -> EIO). tonic is already in the lockfile via
# dtfs-client/dtfs-proto; this just makes Status downcastable in the adapter.
tonic = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
# P0-11: disk-cache atime updates
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
# Bug BQ-1/BU-2 unit tests use tokio's paused-clock test harness
# (`start_paused`, `tokio::time::advance`), which lives behind the
# `test-util` feature. `full` does NOT include it; without this the bin's
# tests only compiled when feature-unified with another crate that pulled
# test-util in. Pin it here so `cargo test -p dtfs-fuse` works standalone.
tokio = { workspace = true, features = ["test-util"] }

# fuse3 requires libfuse3 and is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
fuse3 = { version = "0.7", features = ["tokio-runtime", "file-lock"] }
libc = "0.2"
futures-util = "0.3"
