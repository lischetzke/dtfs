[package]
name = "dtfs-manager"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dtfs-manager"
path = "src/main.rs"

[dependencies]
dtfs-common = { workspace = true }
dtfs-proto = { workspace = true }
dtfs-raft = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
rust-embed = { workspace = true }
prometheus-client = { workspace = true }
openraft = { workspace = true }
xxhash-rust = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hex = { workspace = true }
# AZ-5 — write-to-disk on POST /config persists merged config back
# to /etc/dtfs/manager.toml so the change survives a process restart.
toml = { workspace = true }
# P1-8 alert webhooks: HMAC-signed POST to operator-configured sinks.
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
