name: Feature request
description: Propose a new capability or a change in behaviour.
labels: ["feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should DTFS do? Include config keys, CLI flags or API shapes if you have them in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes config, CLI, API or on-disk format (breaking or needs an update step)
        - label: Touches replication, the anchor copy or integrity checks
