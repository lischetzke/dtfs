# git-cliff config for DTFS release notes (AIWF-4-1).
#
# Groups release notes by commit SUBJECTS/trailers, not PR labels
# (CLAUDE.md B.1 defaults to committing straight to master, so most
# user-visible work never gets a PR to label). Convention:
#   - subject prefix `bug:` / `feat:` / `int:` (`int:` and `docs:` are
#     excluded from the notes entirely).
#   - a `Breaking:` or `Update-required:` trailer anywhere in the
#     commit body routes it into that section regardless of prefix.
#   - a `Known-issue:` trailer routes it into Known Issues.
# .github/workflows/release.yml (orhun/git-cliff-action) and, when
# git-cliff is installed, scripts/dtfs-release.sh produce `notes.md` for
# `gh release create --notes-file`.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
# Full releases only (vX.Y.Z): anything else must not cut the "since the
# last release" range of the notes.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_preprocessors = []
commit_parsers = [
  { message = "Breaking:", group = "Breaking Changes" },
  { message = "Update-required:", group = "Special Requirements for Updates" },
  { message = "Known-issue:", group = "Known Issues" },
  { message = "^feat:", group = "New Features" },
  { message = "^bug:", group = "Bug Fixes" },
  { message = "^int:", skip = true },
  { message = "^docs:", skip = true },
  { message = ".*", group = "Other Changes" },
]
