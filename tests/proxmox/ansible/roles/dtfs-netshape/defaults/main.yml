---
# DC-class shaping defaults. Per-host overrides are set in inventory
# group_vars/<dc>.yml (e.g. group_vars/dc-a.yml).

# Egress rate cap (Mbps). Applied via HTB on eth0.
dtfs_shape_up_mbps: 1000

# Ingress rate cap (Mbps). Applied via IFB mirror.
dtfs_shape_down_mbps: 1000

# Netem jitter on the egress path (ms ± half-jitter, correlated).
dtfs_shape_delay_ms: 1
dtfs_shape_jitter_ms: 0

# Interface to shape. Cloud-init networks bring up eth0 on Proxmox by default.
dtfs_shape_iface: eth0

# IFB module + interface for ingress shaping. Single ifb0 is sufficient.
dtfs_shape_ifb: ifb0

# Ports exempted from shaping so management/Raft traffic isn't
# bottlenecked. CLAUDE.md §9 lists the required exemptions explicitly:
# without exempting Raft ports, heartbeats are throttled by the shaped
# link and the cluster suffers election storms (Bug Y, observed on
# Plexmedia: all-LELI voters churn through 800+ Raft terms in minutes
# under load because heartbeats compete with chunk traffic on the
# 40 Mbps shaped link).
dtfs_shape_exempt_ports:
  - 22       # SSH
  - 123      # NTP
  - 9400     # Raft transport listen port (Bug Y)
  - 9401     # Manager gRPC (carries RaftTransport RPCs) (Bug Y)
  - 9402     # Manager metrics/REST
  - 9403     # Data node metrics
  - 9500     # Data gRPC (chunk read/replicate; not exempting causes
             # repeated migration backoffs under shaping) (Bug Y)

# Marker file path; the apply task touches it after success so the revert
# task can detect a half-installed state.
dtfs_shape_marker: /var/lib/dtfs/netshape.applied
