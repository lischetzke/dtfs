---
# Plexmedia inventory — real-world target topology for DTFS soak.
#
# DC LELI (40 Mbps DSL anchor): mgr01-03 (all quorum voters), data-primary01 (4×150 GB cold), client01
# DC TORO (400 Mbps warm-cache): mgr04 (observer), data-warm01 (180 GB SSD warm), client02 (40 GB disk cache, 90d TTL)
# DC NRB  (1 Gbps ingest):       mgr05 (observer), data-warm02 (180 GB), client03 (download path)
#
# IP plan:
#   .150       builder (kept alive)
#   .151..153  mgr01-03 in LELI (voters)
#   .154       mgr04 in TORO
#   .155       mgr05 in NRB
#   .156       data-primary01 in LELI
#   .157       data-warm01 in TORO
#   .158       data-warm02 in NRB
#   .159..161  client01-03 in LELI/TORO/NRB
all:
  children:
    dtfs_all:
      children:
        managers:
          hosts:
            mgr01:
              ansible_host: 10.150.0.151
              dtfs_node_id: 1
              dtfs_dc: leli
              dtfs_rack: leli-rack-1
              dtfs_is_bootstrap: true
              dtfs_is_voter: true
            mgr02:
              ansible_host: 10.150.0.152
              dtfs_node_id: 2
              dtfs_dc: leli
              dtfs_rack: leli-rack-2
              dtfs_is_bootstrap: false
              dtfs_is_voter: true
            mgr03:
              ansible_host: 10.150.0.153
              dtfs_node_id: 3
              dtfs_dc: leli
              dtfs_rack: leli-rack-3
              dtfs_is_bootstrap: false
              dtfs_is_voter: true
            mgr04:
              ansible_host: 10.150.0.154
              dtfs_node_id: 4
              dtfs_dc: toro
              dtfs_rack: toro-rack-1
              dtfs_is_bootstrap: false
              # Non-voting observer — TORO dashboard locality, doesn't affect quorum.
              dtfs_is_voter: false
            mgr05:
              ansible_host: 10.150.0.155
              dtfs_node_id: 5
              dtfs_dc: nrb
              dtfs_rack: nrb-rack-1
              dtfs_is_bootstrap: false
              dtfs_is_voter: false

        data_nodes:
          hosts:
            data-primary01:
              ansible_host: 10.150.0.156
              dtfs_node_id: 10
              dtfs_dc: leli
              dtfs_rack: leli-rack-1
              # Anchor data node — 4 cold-tier disks, ~600 GB total.
              # Anchor invariant (P0-10) keeps at least 1 replica of every
              # file pinned to LELI; this node holds it.
              dtfs_disks:
                - { path: /mnt/primary-cold-1, tier: cold }
                - { path: /mnt/primary-cold-2, tier: cold }
                - { path: /mnt/primary-cold-3, tier: cold }
                - { path: /mnt/primary-cold-4, tier: cold }
            data-warm01:
              ansible_host: 10.150.0.157
              dtfs_node_id: 11
              dtfs_dc: toro
              dtfs_rack: toro-rack-1
              # TORO SSD warm tier. Empty at bootstrap; reads_by_dc (P0-9)
              # promotes hot chunks here so Plex streams stay local.
              dtfs_disks:
                - { path: /mnt/toro-warm, tier: warm }
            data-warm02:
              ansible_host: 10.150.0.158
              dtfs_node_id: 12
              dtfs_dc: nrb
              dtfs_rack: nrb-rack-1
              # NRB warm tier; ingest path. Anchor invariant forces a
              # replica to migrate from here to data-primary01 within
              # minutes of any new write.
              dtfs_disks:
                - { path: /mnt/nrb-warm, tier: warm }

        clients:
          hosts:
            client01:
              ansible_host: 10.150.0.159
              dtfs_dc: leli
              dtfs_rack: leli-client
              dtfs_mount_point: /mnt/dtfs
              # LELI viewer: local primary data, tmpfs only.
              dtfs_cache_type: tmpfs
              dtfs_cache_max_gb: 2
              dtfs_cache_max_age_days: null
            client02:
              ansible_host: 10.150.0.160
              dtfs_dc: toro
              dtfs_rack: toro-client
              dtfs_mount_point: /mnt/dtfs
              # TORO viewer — most aggressive cache target.
              dtfs_cache_type: disk
              dtfs_cache_dir: /var/cache/dtfs
              dtfs_cache_max_gb: 40
              dtfs_cache_max_age_days: 90
              dtfs_readahead_mode: folder-sequential
            client03:
              ansible_host: 10.150.0.161
              dtfs_dc: nrb
              dtfs_rack: nrb-client
              dtfs_mount_point: /mnt/dtfs
              # Ingest path — writes new media files.
              dtfs_cache_type: tmpfs
              dtfs_cache_max_gb: 2
              dtfs_cache_max_age_days: null

    # Per-DC groups for bandwidth shaping + group_vars overrides.
    dc_leli:
      hosts:
        mgr01:
        mgr02:
        mgr03:
        data-primary01:
        client01:
    dc_toro:
      hosts:
        mgr04:
        data-warm01:
        client02:
    dc_nrb:
      hosts:
        mgr05:
        data-warm02:
        client03:

  vars:
    ansible_user: debian
    ansible_ssh_private_key_file: ~/.ssh/dtfs-lab/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
