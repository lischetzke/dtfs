---
# 3-DC inventory for the prod-readiness campaign.
# Group nesting mirrors the JSON inventory: dtfs_all/{managers, data_nodes,
# clients} × {dc_a, dc_b, dc_c} for per-DC group_vars overrides.
all:
  children:
    dtfs_all:
      children:
        managers:
          hosts:
            mgr-01:
              ansible_host: 10.150.0.151
              dtfs_node_id: 1
              dtfs_dc: dc-a
              dtfs_rack: dc-a-rack-1
              dtfs_is_bootstrap: true
            mgr-02:
              ansible_host: 10.150.0.152
              dtfs_node_id: 2
              dtfs_dc: dc-b
              dtfs_rack: dc-b-rack-1
              dtfs_is_bootstrap: false
            mgr-03:
              ansible_host: 10.150.0.153
              dtfs_node_id: 3
              dtfs_dc: dc-c
              dtfs_rack: dc-c-rack-1
              dtfs_is_bootstrap: false

        data_nodes:
          hosts:
            data-a1:
              ansible_host: 10.150.0.154
              dtfs_node_id: 10
              dtfs_dc: dc-a
              dtfs_rack: dc-a-rack-1
              dtfs_disks:
                - { path: /mnt/hot,  tier: hot }
                - { path: /mnt/cold, tier: cold }
            data-a2:
              ansible_host: 10.150.0.155
              dtfs_node_id: 11
              dtfs_dc: dc-a
              dtfs_rack: dc-a-rack-2
              dtfs_disks:
                - { path: /mnt/hot,  tier: hot }
                - { path: /mnt/cold, tier: cold }
            data-b1:
              ansible_host: 10.150.0.156
              dtfs_node_id: 12
              dtfs_dc: dc-b
              dtfs_rack: dc-b-rack-1
              dtfs_disks:
                - { path: /mnt/warm, tier: warm }
            data-b2:
              ansible_host: 10.150.0.157
              dtfs_node_id: 13
              dtfs_dc: dc-b
              dtfs_rack: dc-b-rack-2
              dtfs_disks:
                - { path: /mnt/warm, tier: warm }
            data-c1:
              ansible_host: 10.150.0.158
              dtfs_node_id: 14
              dtfs_dc: dc-c
              dtfs_rack: dc-c-rack-1
              dtfs_disks:
                - { path: /mnt/warm, tier: warm }
            data-c2:
              ansible_host: 10.150.0.159
              dtfs_node_id: 15
              dtfs_dc: dc-c
              dtfs_rack: dc-c-rack-2
              dtfs_disks:
                - { path: /mnt/warm, tier: warm }

        clients:
          hosts:
            client-a:
              ansible_host: 10.150.0.160
              dtfs_dc: dc-a
              dtfs_rack: dc-a-client
              dtfs_mount_point: /mnt/dtfs
              dtfs_cache_type: tmpfs
              dtfs_cache_max_gb: 5
              dtfs_cache_max_age_days: null
            client-b:
              ansible_host: 10.150.0.161
              dtfs_dc: dc-b
              dtfs_rack: dc-b-client
              dtfs_mount_point: /mnt/dtfs
              dtfs_cache_type: disk
              dtfs_cache_dir: /var/cache/dtfs
              dtfs_cache_max_gb: 100
              # 90-day cap as a safety upper bound; primary eviction is
              # LRU-by-atime size pressure. Cached chunks normally stay
              # as long as they fit and get viewer reads (scanner reads
              # don't refresh atime by design).
              dtfs_cache_max_age_days: 90
              dtfs_readahead_mode: folder-sequential
            client-c:
              ansible_host: 10.150.0.162
              dtfs_dc: dc-c
              dtfs_rack: dc-c-client
              dtfs_mount_point: /mnt/dtfs
              dtfs_cache_type: tmpfs
              dtfs_cache_max_gb: 5
              dtfs_cache_max_age_days: null

    # Per-DC groups inferred from dtfs_dc above.
    dc_a:
      hosts:
        mgr-01:
        data-a1:
        data-a2:
        client-a:
    dc_b:
      hosts:
        mgr-02:
        data-b1:
        data-b2:
        client-b:
    dc_c:
      hosts:
        mgr-03:
        data-c1:
        data-c2:
        client-c:

  vars:
    ansible_user: debian
    ansible_ssh_private_key_file: ~/.ssh/dtfs-lab/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
