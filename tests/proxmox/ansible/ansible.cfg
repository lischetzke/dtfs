[defaults]
inventory = ./hosts.yml
roles_path = ../../ansible/roles
host_key_checking = False
remote_user = debian
private_key_file = ~/.ssh/dtfs-lab/id_ed25519
forks = 10
timeout = 30
retry_files_enabled = False
stdout_callback = yaml
log_path = ./ansible.log

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/dtfs-lab/known_hosts
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
