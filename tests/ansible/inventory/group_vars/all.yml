---
# Pin the Python interpreter so Ansible doesn't reroll on every play if another
# python is installed; matches the python that ships with the Debian 13 image.
ansible_python_interpreter: /usr/bin/python3

# DTFS version and binary paths
dtfs_version: "0.1.0"
dtfs_bin_dir: /usr/local/bin
dtfs_config_dir: /etc/dtfs
dtfs_data_dir: /var/lib/dtfs
dtfs_log_dir: /var/log/dtfs
dtfs_run_dir: /run/dtfs

# Binary names
dtfs_manager_bin: "{{ dtfs_bin_dir }}/dtfs-manager"
dtfs_data_bin: "{{ dtfs_bin_dir }}/dtfs-data"
dtfs_fuse_bin: "{{ dtfs_bin_dir }}/dtfs-fuse"
dtfs_cli_bin: "{{ dtfs_bin_dir }}/dtfs-cli"

# Cluster identity
dtfs_cluster_name: dtfs-test-cluster
dtfs_shared_secret: "supersecret-test-cluster-key-change-in-prod"
dtfs_cluster_id: "test-cluster-001"

# Manager API (primary)
dtfs_manager_api_host: 10.0.1.1
dtfs_manager_api_port: 9402
dtfs_manager_api_url: "http://{{ dtfs_manager_api_host }}:{{ dtfs_manager_api_port }}"

# Manager list (for clients and data nodes) — ports match the real binary schema.
dtfs_managers:
  - host: 10.0.1.1
    port: 9401
    api_port: 9402
    node_id: 1
  - host: 10.0.1.2
    port: 9401
    api_port: 9402
    node_id: 2
  - host: 10.0.1.3
    port: 9401
    api_port: 9402
    node_id: 3

# NTP / time sync
ntp_servers:
  - 0.debian.pool.ntp.org
  - 1.debian.pool.ntp.org
  - 2.debian.pool.ntp.org
  - 3.debian.pool.ntp.org
chrony_makestep: "1 3"
chrony_rtcsync: true
chrony_max_distance: 1.0

# System requirements
dtfs_system_packages:
  - fuse3
  - libfuse3-4
  - chrony
  - xfsprogs
  - smartmontools
  - iproute2
  - iperf3
  - fio
  - bc
  - jq
  - curl
  - htop
  - sysstat
  - tcpdump
  - nftables

# Kernel parameters
dtfs_kernel_params:
  vm.dirty_ratio: 20
  vm.dirty_background_ratio: 5
  vm.dirty_expire_centisecs: 3000
  vm.dirty_writeback_centisecs: 500
  vm.swappiness: 10
  net.core.rmem_max: 134217728
  net.core.wmem_max: 134217728
  net.ipv4.tcp_rmem: "4096 87380 134217728"
  net.ipv4.tcp_wmem: "4096 65536 134217728"
  net.core.netdev_max_backlog: 250000
  net.ipv4.tcp_no_metrics_save: 1
  net.ipv4.tcp_congestion_control: bbr
  fs.file-max: 2097152
  fs.nr_open: 2097152

# DTFS user/group
# UIDs 990-999 are reserved by systemd-* services on Debian 13 — use 980.
dtfs_user: dtfs
dtfs_group: dtfs
dtfs_uid: 980
dtfs_gid: 980

# Chunk and replication defaults (overridden per tier in group_vars)
dtfs_default_chunk_size_mb: 128
dtfs_default_replication_factor: 3

# Logging
dtfs_log_level: info
dtfs_log_format: json

# Metrics / observability
dtfs_metrics_enabled: true
dtfs_metrics_port: 9090
dtfs_tracing_enabled: false

# TLS (disabled for test environment)
dtfs_tls_enabled: false
