---
# Disk configuration (per-host overrides via host_vars or inventory dtfs_disks)
dtfs_disk_default_tier: hot
dtfs_disk_format_if_empty: true
dtfs_disk_xfs_options: "-f -b size=4096 -d agcount=8 -l size=128m"
dtfs_disk_mount_options: "rw,relatime,attr2,inode64,logbufs=8,noquota"

# Hot tier settings
dtfs_hot_tier_paths:
  - /mnt/disk-a
dtfs_hot_tier_cache_size_mb: 4096
dtfs_hot_tier_max_util_pct: 85

# Cold tier settings
dtfs_cold_tier_paths:
  - /mnt/disk-b
dtfs_cold_tier_cache_size_mb: 512
dtfs_cold_tier_max_util_pct: 90

# Cache configuration
dtfs_cache_enabled: true
dtfs_cache_size_mb: 2048
dtfs_cache_eviction_policy: lru
dtfs_cache_ttl_s: 300

# Data node network
dtfs_data_listen_addr: "0.0.0.0"
dtfs_data_port: 7100
dtfs_data_grpc_port: 7101
dtfs_data_max_connections: 500
dtfs_data_io_threads: 8
dtfs_data_network_threads: 4

# Replication receive
dtfs_data_replication_port: 7102
dtfs_data_replication_threads: 4
dtfs_data_replication_bandwidth_mb: 500

# Scrub configuration (per data node)
dtfs_data_scrub_io_priority: idle
dtfs_data_scrub_bandwidth_limit_mb: 100
dtfs_data_scrub_thread_count: 2

# Chunk storage
dtfs_chunk_dir_depth: 2
dtfs_chunk_dir_width: 256
dtfs_chunk_write_mode: direct
dtfs_chunk_fsync_on_write: true

# Manager connection
dtfs_data_manager_endpoints:
  - "{{ hostvars['mgr-01']['ansible_host'] }}:{{ dtfs_grpc_port }}"
  - "{{ hostvars['mgr-02']['ansible_host'] }}:{{ dtfs_grpc_port }}"
  - "{{ hostvars['mgr-03']['ansible_host'] }}:{{ dtfs_grpc_port }}"
dtfs_data_manager_heartbeat_s: 5
dtfs_data_manager_reconnect_interval_s: 10
dtfs_data_registration_retry_count: 10
dtfs_data_registration_retry_delay_s: 3

# Health reporting
dtfs_data_health_check_port: 7103
dtfs_data_stats_interval_s: 10

# Prometheus metrics
dtfs_data_metrics_port: "{{ dtfs_metrics_port }}"
dtfs_data_metrics_path: /metrics

# Disk monitoring
dtfs_smart_check_enabled: true
dtfs_smart_check_interval_hours: 6
dtfs_disk_full_threshold_pct: 95
dtfs_disk_warn_threshold_pct: 80
