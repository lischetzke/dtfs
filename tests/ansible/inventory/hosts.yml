---
all:
  children:
    dtfs_all:
      children:
        managers:
          hosts:
            mgr-01:
              ansible_host: 10.0.1.1
              dtfs_role: manager_data
              dtfs_location: dc1
              dtfs_node_id: 1
              dtfs_is_bootstrap: true
            mgr-02:
              ansible_host: 10.0.1.2
              dtfs_role: manager_data
              dtfs_location: dc1
              dtfs_node_id: 2
              dtfs_is_bootstrap: false
            mgr-03:
              ansible_host: 10.0.1.3
              dtfs_role: manager_only
              dtfs_location: dc2
              dtfs_node_id: 3
              dtfs_is_bootstrap: false

        data_nodes:
          hosts:
            mgr-01:
              ansible_host: 10.0.1.1
              dtfs_role: manager_data
              dtfs_location: dc1
              dtfs_node_id: 1
              dtfs_disks:
                - path: /mnt/disk-a
                  tier: hot
                - path: /mnt/disk-b
                  tier: cold
            mgr-02:
              ansible_host: 10.0.1.2
              dtfs_role: manager_data
              dtfs_location: dc1
              dtfs_node_id: 2
              dtfs_disks:
                - path: /mnt/disk-a
                  tier: hot
                - path: /mnt/disk-b
                  tier: cold
            data-01:
              ansible_host: 10.0.2.1
              dtfs_role: data_only
              dtfs_location: dc1
              dtfs_node_id: 4
              dtfs_disks:
                - path: /mnt/disk-a
                  tier: hot
                - path: /mnt/disk-b
                  tier: cold
            data-02:
              ansible_host: 10.0.2.2
              dtfs_role: data_only
              dtfs_location: dc2
              dtfs_node_id: 5
              dtfs_disks:
                - path: /mnt/disk-a
                  tier: hot
                - path: /mnt/disk-b
                  tier: cold

        clients:
          hosts:
            client-01:
              ansible_host: 10.0.3.1
              dtfs_role: client
              dtfs_location: dc1
              dtfs_mount_point: /mnt/dtfs
              dtfs_volume: default
