---
# DTFS environment setup playbook
# Usage: ansible-playbook playbooks/setup.yml
#
# Cluster bootstrap is config-driven: the manager whose inventory entry has
#   dtfs_is_bootstrap: true
# starts with `bootstrap = true` in /etc/dtfs/manager.toml and initialises the
# single-voter Raft group; the other managers start with `bootstrap = false`
# and are added as voters via the admin API.

- name: Apply base configuration to all nodes
  hosts: dtfs_all
  gather_facts: true
  roles:
    - role: dtfs-common
  tags: [common, base]

- name: Format and mount data-node disks (XFS, LABEL=dtfs-<tier>)
  hosts: data_nodes
  gather_facts: false
  become: true
  tasks:
    - name: Wait for the configured block devices to appear
      ansible.builtin.wait_for:
        path: "{{ item.device }}"
        timeout: 60
      loop: "{{ dtfs_disks | default([]) }}"
      loop_control:
        label: "{{ item.device | default(item.path) }}"
      when: item.device is defined

    - name: Ensure mount points exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ dtfs_user }}"
        group: "{{ dtfs_group }}"
        mode: "0750"
      loop: "{{ dtfs_disks | default([]) }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Detect existing filesystem on each block device
      ansible.builtin.command: "blkid -o value -s TYPE {{ item.device }}"
      register: blkid_check
      changed_when: false
      failed_when: false
      loop: "{{ dtfs_disks | default([]) }}"
      loop_control:
        label: "{{ item.device | default('(no device)') }}"
      when: item.device is defined

    - name: Format empty disks as XFS
      ansible.builtin.command: >
        mkfs.xfs -f -L dtfs-{{ item.item.tier }} {{ item.item.device }}
      when:
        - item.item.device is defined
        - dtfs_disk_format_if_empty | default(true) | bool
        - (item.rc | default(0)) != 0 or (item.stdout | default('')) == ""
      loop: "{{ blkid_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path | default('(skipped)') }}"

    - name: Mount disks and persist in /etc/fstab
      ansible.posix.mount:
        src: "LABEL=dtfs-{{ item.tier }}"
        path: "{{ item.path }}"
        fstype: xfs
        opts: defaults,nofail
        state: mounted
      loop: "{{ dtfs_disks | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when: item.device is defined
  tags: [data, disks]

- name: Deploy bootstrap manager (mgr with dtfs_is_bootstrap=true)
  hosts: managers
  gather_facts: true
  serial: 1
  roles:
    - role: dtfs-manager
  tags: [managers]
  # The dtfs-manager role itself starts the service; the bootstrap node will
  # initialise the Raft cluster via config.cluster.bootstrap=true and the
  # followers will start as standalone voters that must be added via the
  # admin API (see ops docs for `dtfs-cli managers add` once available).

- name: Wait for bootstrap manager to be healthy
  hosts: managers
  gather_facts: false
  tasks:
    - name: Probe /api/v1/health on the bootstrap manager
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:{{ dtfs_api_port }}/api/v1/health"
        method: GET
        status_code: 200
        timeout: 5
      register: mgr_health
      retries: 30
      delay: 2
      until: mgr_health.status == 200
      delegate_to: localhost
      become: false
      run_once: true
      loop: "{{ groups['managers'] | select('match', '.*') | list }}"
      loop_control:
        label: "{{ item }}"
      when: hostvars[item].dtfs_is_bootstrap | default(false)
  tags: [verify, managers]

- name: Deploy and start data nodes
  hosts: data_nodes
  gather_facts: true
  roles:
    - role: dtfs-data
  tags: [data_nodes]

- name: Wait for data nodes to register with the manager
  hosts: managers
  gather_facts: false
  run_once: true
  tasks:
    - name: Pick the bootstrap manager
      ansible.builtin.set_fact:
        bootstrap_mgr_host: >-
          {%- for h in groups['managers'] -%}
            {%- if hostvars[h].dtfs_is_bootstrap | default(false) -%}
              {{ hostvars[h].ansible_host }}
            {%- endif -%}
          {%- endfor -%}

    - name: Poll until all data nodes are healthy
      ansible.builtin.uri:
        url: "http://{{ bootstrap_mgr_host }}:{{ dtfs_api_port }}/api/v1/nodes"
        method: GET
        status_code: 200
        timeout: 10
        return_content: true
      register: nodes_status
      retries: 30
      delay: 3
      until: >-
        nodes_status.status == 200 and
        (nodes_status.json | selectattr('health', 'equalto', 'Healthy') | list | length)
          >= (groups['data_nodes'] | length)
      delegate_to: localhost
      become: false

    - name: Show registered data nodes
      ansible.builtin.debug:
        msg: "Healthy data nodes: {{ nodes_status.json | selectattr('health', 'equalto', 'Healthy') | map(attribute='hostname') | list }}"
  tags: [verify, data_nodes]

- name: Deploy FUSE clients
  hosts: clients
  gather_facts: true
  roles:
    - role: dtfs-client
  tags: [clients]

- name: Final cluster health verification
  hosts: managers
  gather_facts: false
  run_once: true
  tasks:
    - name: Pick the bootstrap manager
      ansible.builtin.set_fact:
        bootstrap_mgr_host: >-
          {%- for h in groups['managers'] -%}
            {%- if hostvars[h].dtfs_is_bootstrap | default(false) -%}
              {{ hostvars[h].ansible_host }}
            {%- endif -%}
          {%- endfor -%}

    - name: Final /api/v1/cluster/status check
      ansible.builtin.uri:
        url: "http://{{ bootstrap_mgr_host }}:{{ dtfs_api_port }}/api/v1/cluster/status"
        method: GET
        status_code: 200
        timeout: 10
        return_content: true
      register: final_status
      retries: 10
      delay: 3
      until: final_status.status == 200 and final_status.json.status == 'ok'
      delegate_to: localhost
      become: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg:
          - "=== DTFS Cluster Setup Complete ==="
          - "Status: {{ final_status.json.status }}"
          - "Files: {{ final_status.json.files }}"
          - "Data nodes (healthy/total): {{ final_status.json.data_nodes_healthy }}/{{ final_status.json.data_nodes }}"
  tags: [verify, final]
