---
# dtfs-client role: install and configure DTFS FUSE client

- name: Copy dtfs-fuse binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../target/release/dtfs-fuse"
    dest: "{{ dtfs_fuse_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart dtfs-fuse

- name: Copy dtfs-cli binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../target/release/dtfs-cli"
    dest: "{{ dtfs_cli_bin }}"
    owner: root
    group: root
    mode: "0755"

- name: Create client directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ dtfs_user }}"
    group: "{{ dtfs_group }}"
    mode: "0755"
  loop:
    - "{{ dtfs_mount_point }}"
    - "{{ dtfs_client_cache_dir }}"
    - "{{ dtfs_log_dir }}/client"
    - "{{ dtfs_data_dir }}/client"

- name: Deploy FUSE client configuration
  ansible.builtin.template:
    src: fuse.toml.j2
    dest: "{{ dtfs_config_dir }}/fuse.toml"
    owner: "{{ dtfs_user }}"
    group: "{{ dtfs_group }}"
    mode: "0640"
    validate: "{{ dtfs_fuse_bin }} --config %s --validate"
  notify: restart dtfs-fuse

- name: Deploy dtfs-fuse@.service template unit
  ansible.builtin.template:
    src: dtfs-fuse@.service.j2
    dest: /etc/systemd/system/dtfs-fuse@.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart dtfs-fuse

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable dtfs-fuse service for default volume
  ansible.builtin.systemd:
    name: "dtfs-fuse@{{ dtfs_volume }}.service"
    enabled: true

- name: Start dtfs-fuse service for default volume
  ansible.builtin.systemd:
    name: "dtfs-fuse@{{ dtfs_volume }}.service"
    state: started

- name: Wait for FUSE mount to become available
  ansible.builtin.wait_for:
    path: "{{ dtfs_mount_point }}"
    state: present
    timeout: 30

- name: Verify FUSE mount is actually mounted
  ansible.builtin.command: mountpoint -q "{{ dtfs_mount_point }}"
  register: mount_check
  retries: 15
  delay: 2
  until: mount_check.rc == 0
  changed_when: false

- name: Test write to FUSE mount
  ansible.builtin.shell: >
    echo "dtfs-test-$(date +%s)" > {{ dtfs_mount_point }}/.dtfs-health-check &&
    cat {{ dtfs_mount_point }}/.dtfs-health-check &&
    rm -f {{ dtfs_mount_point }}/.dtfs-health-check
  changed_when: false
  register: fuse_write_test

- name: Assert FUSE write test succeeded
  ansible.builtin.assert:
    that:
      - fuse_write_test.rc == 0
    msg: "FUSE write test failed on {{ inventory_hostname }}: {{ fuse_write_test.stderr }}"

- name: Display mount info
  ansible.builtin.command: df -h "{{ dtfs_mount_point }}"
  register: mount_info
  changed_when: false

- name: Show mount details
  ansible.builtin.debug:
    var: mount_info.stdout_lines
