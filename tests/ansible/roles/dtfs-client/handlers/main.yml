---
- name: restart dtfs-fuse
  ansible.builtin.systemd:
    name: "dtfs-fuse@{{ dtfs_volume }}.service"
    state: restarted
    daemon_reload: true

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: unmount dtfs fuse
  ansible.builtin.command: "fusermount3 -u {{ dtfs_mount_point }}"
  changed_when: true
  failed_when: false
