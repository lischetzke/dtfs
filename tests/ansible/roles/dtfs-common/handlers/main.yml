---
- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    daemon_reload: false

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
