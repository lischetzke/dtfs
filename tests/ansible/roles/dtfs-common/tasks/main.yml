---
# dtfs-common role: base system configuration for all DTFS nodes

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required system packages
  ansible.builtin.apt:
    name: "{{ dtfs_system_packages }}"
    state: present

- name: Create dtfs group
  ansible.builtin.group:
    name: "{{ dtfs_group }}"
    gid: "{{ dtfs_gid }}"
    state: present

- name: Create dtfs user
  ansible.builtin.user:
    name: "{{ dtfs_user }}"
    uid: "{{ dtfs_uid }}"
    group: "{{ dtfs_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ dtfs_data_dir }}"
    create_home: false
    comment: "DTFS service user"
    state: present

- name: Create DTFS directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ dtfs_user }}"
    group: "{{ dtfs_group }}"
    mode: "0750"
  loop:
    - "{{ dtfs_data_dir }}"
    - "{{ dtfs_config_dir }}"
    - "{{ dtfs_log_dir }}"
    - "{{ dtfs_run_dir }}"
    - "{{ dtfs_bin_dir }}"

- name: Configure kernel parameters via sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-dtfs.conf
  loop: "{{ dtfs_kernel_params | dict2items }}"

- name: Enable FUSE for all users via /etc/fuse.conf
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: '^#?user_allow_other'
    line: 'user_allow_other'
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Load fuse kernel module
  community.general.modprobe:
    name: fuse
    state: present

- name: Ensure fuse module loads at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/fuse.conf
    content: "fuse\n"
    owner: root
    group: root
    mode: "0644"

- name: Add dtfs user to fuse group (if group exists)
  ansible.builtin.user:
    name: "{{ dtfs_user }}"
    groups: fuse
    append: true
  ignore_errors: true

- name: Set open file limits for dtfs user
  ansible.builtin.copy:
    dest: /etc/security/limits.d/dtfs.conf
    content: |
      {{ dtfs_user }}    soft    nofile    1048576
      {{ dtfs_user }}    hard    nofile    1048576
      {{ dtfs_user }}    soft    nproc     65536
      {{ dtfs_user }}    hard    nproc     65536
      {{ dtfs_user }}    soft    memlock   unlimited
      {{ dtfs_user }}    hard    memlock   unlimited
    owner: root
    group: root
    mode: "0644"

- name: Set systemd DefaultLimitNOFILE
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?DefaultLimitNOFILE='
    line: 'DefaultLimitNOFILE=1048576'
    state: present
  notify: reload systemd

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Wait for chrony to synchronize (up to 60s)
  ansible.builtin.command: chronyc waitsync 12 0.1 0.05 1
  register: chrony_sync_result
  retries: 6
  delay: 10
  until: chrony_sync_result.rc == 0
  changed_when: false
  failed_when: false

- name: Verify chrony synchronization status
  ansible.builtin.command: chronyc tracking
  register: chrony_tracking
  changed_when: false

- name: Check that system clock is synchronized
  ansible.builtin.command: chronyc tracking
  register: chrony_check
  changed_when: false
  failed_when: "'Not synchronised' in chrony_check.stdout and chrony_sync_result.rc != 0"

- name: Display chrony tracking info
  ansible.builtin.debug:
    var: chrony_tracking.stdout_lines
    verbosity: 1

- name: Disable swap (not recommended for DTFS data nodes)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true
  ignore_errors: true

- name: Remove swap from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1  # disabled by dtfs-common role'

- name: Configure SSH authorized key for dtfs-admin
  ansible.posix.authorized_key:
    user: dtfs-admin
    key: "{{ lookup('file', '~/.ssh/dtfs_test_key.pub') }}"
    state: present
  ignore_errors: true

- name: Configure journald for persistent logging
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/dtfs.conf
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=2G
      SystemMaxFileSize=100M
      MaxRetentionSec=7day
      RateLimitIntervalSec=30
      RateLimitBurst=10000
    owner: root
    group: root
    mode: "0644"
  notify: restart systemd-journald

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Create dtfs-cli wrapper for dtfs-admin user
  ansible.builtin.copy:
    dest: /etc/profile.d/dtfs.sh
    content: |
      # DTFS environment
      export DTFS_MANAGER="{{ dtfs_manager_api_url }}"
      export DTFS_CLUSTER="{{ dtfs_cluster_name }}"
      export PATH="{{ dtfs_bin_dir }}:$PATH"
    owner: root
    group: root
    mode: "0644"
