[book]
authors = ["DTFS Team"]
language = "en"
multilingual = false
src = "src"
title = "DTFS Documentation"
description = "Comprehensive documentation for the DTFS Distributed Tiered Filesystem"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lischetzke/dtfs"
edit-url-template = "https://github.com/lischetzke/dtfs/edit/main/docs/{path}"
site-url = "/docs/"
