syntax = "proto3";
package dtfs.cluster;

import "common.proto";

service ClusterJoin {
  // Request to join the cluster (first step)
  rpc RequestJoin(JoinRequest) returns (JoinResponse);

  // Complete the join after TLS setup (second step)
  rpc CompleteJoin(JoinCompletionRequest) returns (JoinCompletionResponse);
}

message JoinRequest {
  bytes secret_hmac = 1;        // HMAC(shared_secret, nonce)
  string nonce = 2;
  dtfs.common.NodeInfo node_info = 3;
}

message JoinResponse {
  bool accepted = 1;
  string challenge = 2;
  bytes cluster_ca_cert = 3;    // PEM-encoded CA certificate
  repeated dtfs.common.NodeInfo managers = 4;
  string rejection_reason = 5;
}

message JoinCompletionRequest {
  string node_id = 1;
  bytes challenge_response = 2;
}

message JoinCompletionResponse {
  bool success = 1;
  uint64 config_version = 2;
  string config_json = 3;      // Full cluster config as JSON
}
