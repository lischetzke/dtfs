syntax = "proto3";
package dtfs.common;

// PROTO-3 / CR2-7-7 — NodeId, ChunkId, ChunkMeta, TierReplication,
// WriteSafety and VolumeConfig were removed: `grep -rn
// "dtfs::common::\(TierReplication\|VolumeConfig\|NodeId\|ChunkId\|
// ChunkMeta\|WriteSafety\)" crates/` returned zero Rust callers (the
// runtime replication/volume-config shapes live in
// dtfs-common/src/types.rs, not on this wire). Do not re-add a message
// here without a Rust caller — see CLAUDE.md § A.8 PROTO-3 entry.

message Location {
  string region = 1;
  string datacenter = 2;
  string rack = 3;
  string host = 4;
}

message DiskInfo {
  uint32 disk_id = 1;
  string uuid = 2;
  string mount_path = 3;
  string tier = 4; // "hot", "warm", "cold", "tape"
  uint64 total_bytes = 5;
  uint64 used_bytes = 6;
  string status = 7; // "healthy", "degraded", "draining", "failed", "removed"
}

message NodeInfo {
  string id = 1;
  string role = 2; // "manager", "data" or "client"
  string hostname = 3;
  uint32 grpc_port = 4;
  Location location = 5;
  repeated DiskInfo disks = 6;
  uint64 total_capacity = 7;
  uint64 used_capacity = 8;
  string health_status = 9;
}
