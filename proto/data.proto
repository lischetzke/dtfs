syntax = "proto3";
package dtfs.data;

import "common.proto";

service DataService {
  // Store a chunk (client streaming: sends data in pieces)
  rpc PutChunk(stream PutChunkRequest) returns (PutChunkResponse);

  // Retrieve a chunk (server streaming: returns data in pieces)
  rpc GetChunk(GetChunkRequest) returns (stream GetChunkResponse);

  // Delete a chunk
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);

  // Replicate a chunk from this node to another
  rpc ReplicateChunk(ReplicateChunkRequest) returns (ReplicateChunkResponse);

  // Verify chunk integrity
  rpc VerifyChunk(VerifyChunkRequest) returns (VerifyChunkResponse);

  // Get disk status for all disks on this node
  rpc GetDiskStatus(DiskStatusRequest) returns (DiskStatusResponse);

  // Report I/O statistics
  rpc ReportStats(StatsRequest) returns (StatsResponse);

  // Bug AV (AV-4-1c) — record a client-side cache hit so the
  // data-node's per-DC read counter reflects ALL client reads,
  // not only the ones that traverse the network. Without this,
  // the FUSE readahead cache (and disk-backed local cache)
  // absorbs repeat reads and the tiering engine never sees
  // enough demand to fire a `cache.promote`. Lightweight: no
  // data transfer, idempotent, fire-and-forget.
  rpc RecordCacheHit(RecordCacheHitRequest) returns (RecordCacheHitResponse);

  // Bug BC-6 — enumerate every chunk_id this data node holds on disk.
  // The manager-side orphan_scrub tick (BC-7) calls this periodically,
  // diffs the result against state_machine.chunk_locations, and reaps
  // anything on disk that no FileMetadata references after a grace
  // period. Paged so a node with millions of chunks doesn't ship a
  // single multi-MB response.
  rpc ListChunks(ListChunksRequest) returns (ListChunksResponse);
}

// Bug BC-6 — body for ListChunks. `page_token` is an opaque cursor
// returned by a previous call; empty starts from the beginning.
// `limit` caps response size; the server may return fewer.
message ListChunksRequest {
  string page_token = 1;
  uint32 limit      = 2;
}

message ListChunksResponse {
  // Hex-encoded chunk_ids actually present on disk (`.dat` files
  // whose `.meta` companion also exists). The orphan_scrub planner
  // intersects this set with manager-side `chunk_locations`.
  repeated string chunk_ids = 1;
  // Opaque cursor; empty when no more pages remain.
  string next_page_token = 2;
  // Bug CB — on-disk `.dat` mtime in Unix milliseconds, index-aligned
  // with `chunk_ids`. The orphan reaper measures the reap grace against
  // this DURABLE per-chunk age instead of a manager-local "first
  // observed orphan" clock, so the grace survives manager restarts and
  // leadership changes (see scheduler::orphan_reap_due). A pre-Bug-CB
  // data node leaves this empty; the manager treats a missing/zero
  // mtime as "age unknown -> not yet due" and defers the reap rather
  // than risk dropping an in-flight write.
  repeated uint64 chunk_mtimes_ms = 3;
  // CR2-7-2 / MGR-10 — the disk_id each chunk_ids[i] was found on,
  // index-aligned with chunk_ids (same positional convention as
  // chunk_mtimes_ms). Lets the manager key its expected/on-disk sets by
  // (node_id, disk_id) instead of node-wide, so a de-located leftover on
  // one disk of a node still holding another-tier replica of the same
  // chunk is reaped on the RIGHT disk. A pre-CR2-7-2 data node leaves this
  // empty; the manager falls back to today's node-wide (disk_id=None)
  // reap semantics exactly.
  repeated uint32 chunk_disk_ids = 4;
}

// AV-4-1c — body for RecordCacheHit. Same shape as the
// (chunk_id, requester_dc) tracking key on GetChunk so the
// data-node simply funnels it into the same metrics path.
message RecordCacheHitRequest {
  string chunk_id = 1;
  string requester_dc = 2;
  string requester_host = 3;
}

message RecordCacheHitResponse {}

// --- PutChunk ---
message PutChunkRequest {
  string chunk_id = 1;    // Hex-encoded chunk ID (set in first message)
  string volume_id = 2;   // Volume ID (set in first message)
  string tier = 3;        // Target tier (set in first message)
  bytes data = 4;         // Chunk data payload
}

message PutChunkResponse {
  string chunk_id = 1;
  uint64 size = 2;
  string checksum = 3;    // Hex-encoded BLAKE3 checksum
  bool success = 4;
  // AV-4-8 — disk_id the chunk physically landed on. The FUSE writer
  // propagates this into ChunkLocationCommit so the manager's
  // `id_to_tiers` lookup resolves the correct tier; pre-fix FUSE
  // hardcoded `disk_id: 0` and the cache planner saw every cold-tier
  // placement as warm-tier, killing the cache lifecycle.
  uint32 disk_id = 5;
}

// --- GetChunk ---
message GetChunkRequest {
  string chunk_id = 1;    // Hex-encoded chunk ID
  // P0-9: requester DC for `reads_by_dc` telemetry. Drives the
  // tiering engine's "move replica toward active DC" decisions.
  // Empty string means "unknown DC" and is accepted (counter not
  // bucketed) so older clients without the field still work.
  string requester_dc = 2;
  // Optional: requester host (for debugging hot/cold reads).
  string requester_host = 3;
}

message GetChunkResponse {
  bytes data = 1;         // Chunk data payload
  uint64 offset = 2;      // Offset in the full chunk
  uint64 total_size = 3;  // Total size of the chunk
}

// --- DeleteChunk ---
message DeleteChunkRequest {
  string chunk_id = 1;
  // CO-1-1 — delete ONLY the copy on this specific disk. Replica
  // identity is (node_id, disk_id): a chunk may legally hold a
  // mandatory anchor copy and a cache copy on ONE node across
  // DIFFERENT disks/tiers, so a node-wide "delete first copy found"
  // could unlink the cold anchor when demoting the warm cache copy.
  //
  // `optional` gives proto3 explicit presence: ABSENT (an old manager,
  // or a path with no disk context) -> legacy first-found across all
  // disks; PRESENT -> unlink only the matching disk's copy. A pre-CO-1-1
  // data node ignores the unknown field and keeps doing first-found,
  // which is the documented legacy behaviour.
  optional uint32 disk_id = 2;
  // CO-1-1 — informational tier hint of the copy being deleted
  // ("hot"/"warm"/"cold"/"tape"); empty when unset. Carried for audit
  // parity with the manager-side action; the store resolves the disk by
  // disk_id, not by tier.
  string tier = 3;
}

message DeleteChunkResponse {
  bool success = 1;
  // Bug AV — true when the chunk existed on this data node before
  // the delete; false when the operation was a no-op (chunk wasn't
  // present, e.g. a retry after a previous successful delete, or a
  // race with another delete path). Callers (notably the cache-flush
  // scheduler routine) use this to distinguish "I freed a replica"
  // from "no work to do" without forcing the operation to error on
  // the latter.
  bool was_present = 2;
  // Bug AV — bytes released by this delete. 0 when was_present=false
  // or when the file size couldn't be stat'd. Lets the caller drive
  // per-node accounting without re-querying disk usage.
  uint64 freed_bytes = 3;
}

// --- ReplicateChunk ---
message ReplicateChunkRequest {
  string chunk_id = 1;
  string target_address = 2;  // Address of the target data node
  // AV-5-9 — the tier the target node should write the replica to.
  // Empty preserves the legacy behaviour (target's `put_chunk`
  // falls back to `DiskTier::Hot` then to "any healthy disk"). The
  // cache-promotion path now sets this so a warm promotion actually
  // lands on the warm disk, not whichever has the most free space.
  string target_tier = 3;
}

message ReplicateChunkResponse {
  bool success = 1;
  string error = 2;
  // The disk the target actually stored the replica on. Unset from old
  // data nodes; the manager must then not guess among several disks.
  optional uint32 disk_id = 3;
}

// --- VerifyChunk ---
message VerifyChunkRequest {
  string chunk_id = 1;
}

message VerifyChunkResponse {
  bool valid = 1;
  string error = 2;
}

// --- DiskStatus ---
message DiskStatusRequest {}

message DiskStatusResponse {
  string hostname = 1;
  repeated dtfs.common.DiskInfo disks = 2;
}

// --- Stats ---
message StatsRequest {}

message StatsResponse {
  uint64 total_chunks = 1;
  uint64 total_bytes = 2;
  uint64 cache_hits = 3;
  uint64 cache_misses = 4;
}
