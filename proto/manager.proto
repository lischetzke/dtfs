syntax = "proto3";
package dtfs.manager;

import "common.proto";

service ManagerService {
  // --- Client-facing RPCs ---

  // Create a new file in the namespace
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);

  // Get chunk locations for a file
  rpc GetFileLocations(GetFileLocationsRequest) returns (GetFileLocationsResponse);

  // Delete a file
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // List directory contents
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  // Allocate chunk placements for writing
  rpc AllocateChunks(AllocateChunksRequest) returns (AllocateChunksResponse);

  // Merge chunk location entries for a file (after successful data-node writes)
  rpc CommitChunkLocations(CommitChunkLocationsRequest) returns (CommitChunkLocationsResponse);

  // --- Extended POSIX surface (F-034 .. F-038) ---

  // Atomic rename (mv) within the namespace
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);

  // Set the file's logical size (truncate + fallocate paths)
  rpc SetFileSize(SetFileSizeRequest) returns (SetFileSizeResponse);

  // Create a symbolic link (path -> target string)
  rpc CreateSymlink(CreateSymlinkRequest) returns (CreateSymlinkResponse);

  // Resolve a symbolic link to its target
  rpc ReadSymlink(ReadSymlinkRequest) returns (ReadSymlinkResponse);

  // Create a hard link (chunks shared with the source)
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse);

  // Total/used cluster capacity (statvfs backing)
  rpc ClusterCapacity(ClusterCapacityRequest) returns (ClusterCapacityResponse);

  // --- Cross-host fcntl coordination (F-039) ---

  // Acquire a POSIX byte-range lock through the cluster
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);

  // Release a previously-acquired byte-range lock
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);

  // Probe whether a lock would block (F_GETLK)
  rpc ProbeLock(ProbeLockRequest) returns (ProbeLockResponse);

  // --- Single-writer leases (P0-1) ---
  // Prevent two FUSE clients from concurrently writing the same path; the
  // last-writer-wins race was a HIGH severity silent-data-loss bug.

  // Acquire exclusive write lease on a path
  rpc AcquireWriteLease(AcquireWriteLeaseRequest) returns (AcquireWriteLeaseResponse);

  // Renew an active lease before expiry (called at half-life during flush)
  rpc RenewWriteLease(RenewWriteLeaseRequest) returns (RenewWriteLeaseResponse);

  // Release a held write lease (on close)
  rpc ReleaseWriteLease(ReleaseWriteLeaseRequest) returns (ReleaseWriteLeaseResponse);

  // Clear all write leases owned by a hostname except those held by a
  // specified PID. Called at FUSE startup to clean orphan leases left by a
  // previous crashed FUSE process (P0-6 crash recovery).
  rpc ReleaseLeasesByHost(ReleaseLeasesByHostRequest) returns (ReleaseLeasesByHostResponse);

  // --- Data node facing RPCs ---

  // Register a data node with the cluster
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Periodic heartbeat from data nodes
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Report chunk status from data nodes
  rpc ReportChunkStatus(ChunkStatusReport) returns (ChunkStatusAck);

  // --- Manager-to-manager forwarding (Bug BL) ---

  // Forward a Raft ClientRequest to the leader. A non-leader manager that
  // receives a data-node heartbeat cannot commit the heartbeat's Raft
  // writes (openraft returns ForwardToLeader), so it proxies them here to
  // the current leader. The leader applies the write via client_write and
  // returns the serialized ClientResponse. Bodies are JSON-serialized
  // dtfs_raft::ClientRequest / ClientResponse (both already serde types),
  // so this RPC is agnostic to the ClientRequest enum shape.
  rpc ForwardClientWrite(ForwardWriteRequest) returns (ForwardWriteResponse);
}

// --- Manager-to-manager forwarding (Bug BL) ---

message ForwardWriteRequest {
  // JSON-serialized dtfs_raft::ClientRequest.
  bytes client_request_json = 1;
  // CO-2-2 — cluster shared secret of the forwarding manager
  // (config.cluster.shared_secret). The leader rejects a forward whose
  // secret does not match (constant-time compare) with PERMISSION_DENIED.
  // Empty when the cluster runs without a shared secret (back-compat);
  // an empty configured secret on the leader skips the check entirely.
  string shared_secret = 2;
}

message ForwardWriteResponse {
  // True when the leader applied the write (client_write succeeded).
  bool success = 1;
  // JSON-serialized dtfs_raft::ClientResponse when success; empty otherwise.
  bytes response_json = 2;
  // Error string when success == false (e.g. the receiver was itself not
  // the leader, or a transport error).
  string error = 3;
}

// --- Extended POSIX message types ---

message RenameFileRequest {
  string from = 1;
  string to = 2;
}
message RenameFileResponse {
  bool success = 1;
  string error = 2;
}

message SetFileSizeRequest {
  string path = 1;
  uint64 new_size = 2;
}
message SetFileSizeResponse {
  bool success = 1;
  string error = 2;
}

message CreateSymlinkRequest {
  string path = 1;
  string target = 2;
}
message CreateSymlinkResponse {
  bool success = 1;
  string error = 2;
}

message ReadSymlinkRequest {
  string path = 1;
}
message ReadSymlinkResponse {
  string target = 1;
  bool found = 2;
}

message CreateLinkRequest {
  string source = 1;
  string dest = 2;
}
message CreateLinkResponse {
  bool success = 1;
  string error = 2;
}

message ClusterCapacityRequest {}
message ClusterCapacityResponse {
  uint64 total_bytes = 1;
  uint64 used_bytes = 2;
  uint64 file_count = 3;
}

// --- Distributed fcntl lock messages ---

message AcquireLockRequest {
  string path = 1;
  string owner_id = 2;  // unique per (host, FUSE process, kernel lock_owner)
  uint64 start = 3;
  uint64 end = 4;
  bool write = 5;       // false = shared (read), true = exclusive (write)
  bool blocking = 6;    // true = caller can wait, false = non-blocking
  uint64 lease_ms = 7;  // lock validity; manager evicts after this without renew
}
message AcquireLockResponse {
  bool granted = 1;
  // If not granted: who currently holds a conflicting lock.
  string conflict_owner = 2;
  uint64 conflict_start = 3;
  uint64 conflict_end = 4;
  bool conflict_write = 5;
}

message ReleaseLockRequest {
  string path = 1;
  string owner_id = 2;
  uint64 start = 3;
  uint64 end = 4;
}
message ReleaseLockResponse {
  bool ok = 1;
}

message ProbeLockRequest {
  string path = 1;
  string owner_id = 2;
  uint64 start = 3;
  uint64 end = 4;
  bool write = 5;
}
message ProbeLockResponse {
  // True if this owner could acquire right now.
  bool would_grant = 1;
  string conflict_owner = 2;
  uint64 conflict_start = 3;
  uint64 conflict_end = 4;
  bool conflict_write = 5;
}

// --- Single-writer lease messages (P0-1) ---

message AcquireWriteLeaseRequest {
  string path = 1;
  // Caller-supplied owner id; the recommended format is "<hostname>:<pid>:<fh>"
  // so the GC can attribute orphan leases to a crashed FUSE process.
  string owner_id = 2;
  // Requested lease duration in milliseconds (manager-side bounded).
  uint64 lease_ms = 3;
}
message AcquireWriteLeaseResponse {
  bool granted = 1;
  // If granted: opaque token used for renew/release.
  string lease_id = 2;
  // If granted: absolute expiry time (UTC milliseconds since epoch).
  uint64 expires_at_ms = 3;
  // If NOT granted: who currently holds the lease, and when it expires.
  string conflict_owner = 4;
  uint64 conflict_expires_at_ms = 5;
}

message RenewWriteLeaseRequest {
  string path = 1;
  string lease_id = 2;
  // Additional time to add to the lease, in milliseconds. The manager
  // computes the new expiry as `now + extension_ms` (not appended to the
  // old expiry) to give a predictable budget under load.
  uint64 extension_ms = 3;
}
message RenewWriteLeaseResponse {
  bool granted = 1;
  uint64 new_expires_at_ms = 2;
}

message ReleaseWriteLeaseRequest {
  string path = 1;
  string lease_id = 2;
}
message ReleaseWriteLeaseResponse {
  bool ok = 1;
}

message ReleaseLeasesByHostRequest {
  // Hostname prefix to match against owner_id ("hostname:" prefix match).
  string hostname = 1;
  // PID of the current FUSE process; leases whose owner contains this PID
  // are preserved (since they belong to the *current*, healthy process).
  uint32 except_pid = 2;
}
message ReleaseLeasesByHostResponse {
  uint32 released_count = 1;
}

// --- CreateFile ---
message CreateFileRequest {
  string path = 1;
  optional string volume_id = 2;
}

message CreateFileResponse {
  bool success = 1;
  uint64 chunk_size = 2;
  string volume_id = 3;
}

// --- GetFileLocations ---
message GetFileLocationsRequest {
  string path = 1;
}

message ChunkLocationInfo {
  string chunk_id = 1;
  uint64 size = 2;
  repeated string node_addresses = 3; // All replica addresses
  // U4 read-locality: per-replica storage tier, lowercase
  // ("hot"/"warm"/"cold"/"tape"), positionally aligned 1:1 with
  // node_addresses. The client uses this as a tie-break when two replicas
  // are at the same physical distance (prefer warm over the cold anchor
  // HDD). Additive/back-compatible: an older manager leaves this empty, in
  // which case the client falls back to pure distance.
  repeated string node_tiers = 4;
  // CO-3-10 read-locality: per-replica topology Location, positionally
  // aligned 1:1 with node_addresses, drawn from each replica node's
  // registered Location in the manager node registry. The FUSE client
  // loads these into its known_locations map so select_read_replica can
  // rank replicas by physical distance + read_location_priority operator
  // intent. Additive/back-compatible: an older manager leaves this empty
  // (or shorter), in which case the missing replica's location is unknown
  // and the client falls back to arbitrary/pure-distance order, exactly
  // like node_tiers handles an older manager.
  repeated dtfs.common.Location node_locations = 5;
  // REV-2-1: this entry's chunk index within the file. The manager groups
  // replicas into a BTreeMap keyed by chunk_index and then emits only the
  // VALUES, so this repeated field is DENSE while a file's index space may be
  // sparse (a truncate followed by a tail write, a partial multi-chunk commit,
  // a location row removed for a whole index). The client indexed it
  // POSITIONALLY by offset/chunk_size, so any gap shifted every later chunk and
  // the reader was served a different chunk's bytes at a valid offset -
  // checksum-clean, with no error anywhere. Additive/back-compatible: an older
  // manager leaves this 0 for every entry, which the client detects (all-zero
  // across a multi-chunk file) and falls back to positional indexing.
  uint64 chunk_index = 6;
}

message GetFileLocationsResponse {
  string path = 1;
  uint64 total_size = 2;
  repeated ChunkLocationInfo chunks = 3;
  // Logical chunk size for this file (bytes). Used by clients to map byte
  // offsets to chunk indices. Added in fix #13.
  uint64 chunk_size = 4;
  // Epoch milliseconds, propagated from the manager's FileMetadata so the
  // FUSE client can return real mtime/ctime via getattr (fix for F-014).
  int64 created_at_ms = 5;
  int64 modified_at_ms = 6;
  // Whether this path is a directory (either an explicit mkdir entry or a
  // synthetic one inferred from existing files under the prefix). Fixes
  // the "mkdir then stat returns ENOENT" bug seen during the 2026-05-18
  // soak recovery (SOAK-RECOVERY-2026-05-18.md, bugs A & B).
  bool is_directory = 7;
  // CR-6-4 (FUSE-6) — the volume this file is actually registered
  // under (`FileMetadata.volume_id`). An older manager leaves this
  // `""`; the FUSE client then keeps whatever volume_id it already
  // has cached for the path rather than falling back to "default"
  // (which silently applies default-volume RF/tier/anchor to a
  // non-default-volume file on every refresh after the first).
  string volume_id = 8;
}

// --- DeleteFile ---
message DeleteFileRequest {
  string path = 1;
}

message DeleteFileResponse {
  bool success = 1;
}

// --- ListDirectory ---
message ListDirectoryRequest {
  string path = 1;
}

message DirectoryEntry {
  string name = 1;
  uint64 size = 2;
  bool is_directory = 3;
  int64 created_at = 4;
  int64 modified_at = 5;
}

message ListDirectoryResponse {
  repeated DirectoryEntry entries = 1;
}

// --- AllocateChunks ---
message AllocateChunksRequest {
  string path = 1;
  uint32 num_chunks = 2;
  string volume_id = 3;
  // Bug AV (AV-3-2) — FUSE client write-path preference. Optional;
  // empty string means "use the volume default" (the legacy
  // behaviour). Recognised values: "cold", "warm", "hot", "tape".
  // The manager's placement engine honours the hint when a healthy
  // node with the requested tier exists in the client's DC;
  // otherwise it falls back to the volume default. Unknown values
  // are also treated as "no preference" so a rolling FUSE upgrade
  // that adds a new tier name doesn't break older managers.
  string preferred_tier = 4;
  // Bug BU-2 — gRPC addresses the client wants EXCLUDED from this
  // allocation (e.g. a node whose put_chunk just returned
  // RESOURCE_EXHAUSTED because its target-tier disk is full). The manager
  // maps each to a node id and removes it from the candidate set, so a
  // retry reroutes to a node with room instead of looping onto the same
  // full disk. Empty = no exclusions (the normal first-attempt path).
  repeated string exclude_addrs = 5;
  // Bug BX-9 — the writer's location, so capacity spill can prefer the
  // fastest+NEAREST tier with room (BX-1 ranking's distance key). Absent /
  // empty location keeps the legacy speed -> free-space ordering (nearness
  // neutral), so older FUSE clients that don't send it still work.
  dtfs.common.Location requester_location = 6;
}

message ChunkPlacement {
  uint32 chunk_index = 1;
  string primary_address = 2;
  repeated string replica_addresses = 3;
  // Bug AV (AV-4-1d) — the manager-resolved target tier as a lowercase
  // string ("hot"/"warm"/"cold"/"tape"). FUSE writers must pass this
  // to the data-node so that `select_disk_for_tier` lands the chunk on
  // the right tier. Empty string preserves legacy behaviour (data-node
  // falls back to "any healthy disk by free capacity").
  string tier = 4;
}

message AllocateChunksResponse {
  repeated ChunkPlacement placements = 1;
}

// --- CommitChunkLocations ---
message ChunkLocationCommit {
  uint32 chunk_index = 1;
  string chunk_id = 2; // hex BLAKE3 id from PutChunkResponse
  string primary_address = 3; // e.g. http://host:9500
  uint64 size_bytes = 4;
  uint32 disk_id = 5;
}

message CommitChunkLocationsRequest {
  string path = 1;
  string volume_id = 2;
  repeated ChunkLocationCommit chunks = 3;
  // Bug P — the lease_id the writer currently holds for `path`. The
  // manager rejects the commit if this doesn't match
  // `sm.write_leases[path].lease_id`. Empty string preserves legacy
  // behaviour for callers that haven't been updated yet (best-effort:
  // if the writer doesn't carry the lease forward, the manager can't
  // protect against concurrent-writer interleaving for this commit).
  string lease_id = 4;
}

message CommitChunkLocationsResponse {
  bool success = 1;
  // Bug P — set when the commit was rejected because lease_id didn't
  // match the currently-held lease. Client should abort and surface
  // an EIO-like error to userspace.
  bool lease_conflict = 2;
  string error = 3;
}

// --- RegisterNode ---
message RegisterNodeRequest {
  string hostname = 1;
  string role = 2;
  uint32 grpc_port = 3;
  dtfs.common.Location location = 4;
  repeated dtfs.common.DiskInfo disks = 5;
  // Must match manager cluster.shared_secret when the cluster secret is non-empty.
  optional string shared_secret = 6;
  // Bug AY — binary version + build date the node is running. Both are
  // strings so the wire format never drifts with type changes; empty
  // values are treated as "unknown" by the manager.
  string version = 7;
  string build_date = 8;
}

message RegisterNodeResponse {
  bool accepted = 1;
  string node_id = 2;
  uint64 config_version = 3;
}

// --- Heartbeat ---
message HeartbeatRequest {
  string node_id = 1;
  uint64 uptime_secs = 2;
  uint64 total_chunks = 3;
  uint64 total_bytes_used = 4;
  uint64 config_version = 5;
  // P0-9: per-chunk read counters bucketed by requester DC. Top-N chunks
  // by recent activity are reported each heartbeat (capped to keep payload
  // bounded). Drives the tiering engine's auto-move-replica decisions.
  repeated PerChunkReadCounter chunk_reads = 6;
  // Cumulative bytes this data node has read/written since process
  // start. The manager computes per-second rates by diffing across
  // heartbeats. Surfaced in /api/v1/stats so the WebUI's I/O
  // throughput card shows real numbers.
  uint64 total_bytes_read = 7;
  uint64 total_bytes_written = 8;
  // Bug AU — per-disk live usage snapshot. The manager previously only
  // received aggregate `total_bytes_used` and never refreshed
  // NodeInfo.disks[*].used_bytes after the initial RegisterNode call,
  // so the Bug AR per-disk view (Nodes page disk table) always showed
  // the at-boot value. With this field the manager replaces
  // disks[i].used_bytes on every heartbeat and the table tracks reality.
  // Optional: older data nodes that don't emit this still register
  // successfully (the manager keeps the boot snapshot in that case).
  repeated DiskUsageSnapshot disk_usage = 9;
  // Bug BF-1 — integrity faults the data node observed since the last
  // heartbeat (verify_on_read mismatch, etc.). The manager iterates
  // each fault and emits ClientRequest::QuarantineNode +
  // RemoveCorruptChunkReplicas. Optional: older data nodes that don't
  // emit this still register successfully + heartbeat normally (older
  // path = no auto-quarantine; operator-driven via the WebUI).
  repeated IntegrityFault integrity_faults = 10;
  // Bug BY — scrub RESULT summaries the data node completed since the last
  // heartbeat (one per disk per quick/deep cycle). The manager issues a
  // ClientRequest::ReportScrubResult per entry so the WebUI "Last Scrub"
  // card + /api/v1/stats.scrub_results_by_node populate. Optional: older
  // data nodes that don't emit this still heartbeat normally.
  repeated ScrubResultReport scrub_results = 11;
}

// Bug BY — one completed scrub result reported by a data node. Mirrors the
// fields of ClientRequest::ReportScrubResult / ScrubRecord.
message ScrubResultReport {
  string disk_path       = 1;
  string level           = 2;  // "quick" or "deep"
  uint64 completed_at_ms = 3;
  uint64 chunks_checked  = 4;
  uint64 chunks_healthy  = 5;
  uint64 chunks_corrupt  = 6;
  uint64 chunks_missing  = 7;
  double duration_secs   = 8;
}

// Bug BF-1 — single integrity-fault record reported by a data node.
// `detector` distinguishes BC-8 verify_on_read from any future inline
// detection paths (deep scrub during background work, etc.).
message IntegrityFault {
  string chunk_id      = 1;
  uint64 observed_at_ms = 2;
  string detector      = 3;  // e.g. "verify_on_read", "verify_on_read_meta_absent"
  uint64 expected_len  = 4;
  uint64 actual_len    = 5;
  string expected_hash = 6;
  string actual_hash   = 7;  // may be empty if the data side couldn't compute it
}

// Bug AU — per-disk live usage delivered with each heartbeat. The data
// node statvfs's each configured disk and ships the result so the
// manager's NodeInfo.disks[*].{total_bytes, used_bytes} reflect current
// reality rather than the at-boot snapshot.
message DiskUsageSnapshot {
  uint32 disk_id = 1;
  uint64 total_bytes = 2;
  uint64 used_bytes = 3;
}

// P0-9: per-chunk read counter, one entry per (chunk, DC) cell, packed
// into per-chunk records to amortise the map overhead.
message PerChunkReadCounter {
  string chunk_id = 1;
  // 1-hour window: DC name -> read count.
  map<string, uint32> reads_by_dc_1h = 2;
  // 24-hour window: DC name -> read count.
  map<string, uint32> reads_by_dc_24h = 3;
  // Last access wall-clock ms (UTC).
  uint64 last_access_ms = 4;
}

message ConfigUpdate {
  uint64 version = 1;
  string config_json = 2; // Full cluster config as JSON
  // AZ-1 — manager-computed scrub override that accounts for per-volume
  // schedules. When present, the data-node's scrub scheduler treats
  // these values as the effective floor (overriding `config.scrub.*`
  // for the lifetime of the heartbeat session). Hot-reloadable —
  // the scheduler picks up changes within 60 s.
  optional ScrubConfigOverride scrub_override = 3;
}

// AZ-1 / Bug BC — scrub + integrity policy pushed to data nodes
// alongside the existing config_json. The data-side scheduler
// hot-reloads these values within 60 s of receiving the heartbeat.
//
// Bug BC-2 extension: the manager now carries the FULL integrity
// policy (orphan cadence, verify_on_read, quarantine_on_fault,
// auto-unquarantine cooldown). Fields 1 + 2 keep the legacy
// hour-units names for wire-compat with managers/data nodes still
// running AZ-1 binaries; fields 3-8 are additive (default-zero on
// older peers).
//
// Rolling-upgrade order: managers first (start emitting the new
// fields with safe defaults), data nodes next (start honouring
// them). A data node that ignores fields 3-8 behaves exactly as
// the AZ-1 baseline.
message ScrubConfigOverride {
  uint64 quick_interval_hours = 1;
  uint64 deep_interval_hours  = 2;

  // Bug BC additions:
  uint64 orphan_interval_secs   = 3;
  uint64 orphan_grace_secs      = 4;
  uint32 max_io_percent         = 5;
  bool   verify_on_read         = 6;
  bool   quarantine_on_fault    = 7;
  uint64 auto_unquarantine_secs = 8;

  // CR-6-3 (PROTO-2) — sub-hour secs companions for fields 1/2. The
  // manager fills BOTH the hours field (rounded up, unchanged
  // back-compat behaviour) and the exact secs field; a data node that
  // understands secs prefers it (no more silent ceil-to-1h on a
  // sub-hour override), an older data node ignores the new fields and
  // keeps working off hours exactly as before. `0` = fall back to
  // `*_hours * 3600`.
  uint64 quick_interval_secs = 9;
  uint64 deep_interval_secs  = 10;
}

message HeartbeatResponse {
  bool accepted = 1;
  uint64 config_version = 2;
  optional ConfigUpdate config_update = 3;
  // Bug BF — clear-signal for the data-side IntegrityFaultCollector's
  // sticky `self_quarantined` flag. True iff the manager's view of
  // this node is NOT Quarantined. The data node clears its local
  // flag on this signal so an operator-driven UnquarantineNode (via
  // /api/v1/nodes/{id}/unquarantine + /ui/integrity) re-enables
  // writes WITHOUT requiring a `systemctl restart dtfs-data`.
  bool self_quarantine_cleared = 4;
  // CF-8 — latest manual scrub trigger (POST /api/v1/scrub), relayed on
  // every heartbeat while pending (it is replaced, never cleared). The
  // data node dedupes by `id` and ignores stale requests, so repeat
  // delivery is harmless. Absent on pre-CF-8 managers; ignored by
  // pre-CF-8 data nodes.
  optional ScrubRequestNow scrub_request = 5;
}

// CF-8 — one manual on-demand scrub request.
message ScrubRequestNow {
  // Unique per trigger (uuid); the data node runs each id at most once
  // per process lifetime.
  string id = 1;
  // "quick" | "deep" (validated at the API boundary).
  string level = 2;
  // Trigger wall-clock (UTC ms). Requests older than the data node's
  // staleness window are ignored (guards restart-reconnect replays).
  uint64 requested_at_ms = 3;
}

// --- ChunkStatus ---
message ChunkStatus {
  string chunk_id = 1;
  uint64 size = 2;
  string status = 3; // "healthy", "corrupt", "missing"
}

message ChunkStatusReport {
  string node_id = 1;
  repeated ChunkStatus chunks = 2;
}

message ChunkStatusAck {
  bool accepted = 1;
}
