# Small Docker lab (not prod-like): 1 manager + 2 data nodes, one network.
# Usage (from deploy/):
#   docker compose -f docker-compose.lab.yml up -d --build
#   curl -s http://127.0.0.1:9402/api/v1/health
#   curl -s http://127.0.0.1:9402/api/v1/stats
#   docker compose -f docker-compose.lab.yml down -v

services:
  mgr-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.manager
    container_name: dtfs-lab-mgr-1
    volumes:
      - ./configs/mgr-1.toml:/etc/dtfs/manager.toml:ro
      - lab-mgr1-data:/var/lib/dtfs/manager
    ports:
      - "9400:9400"
      - "9401:9401"
      - "9402:9402"
    networks:
      lab:
        ipv4_address: 10.10.1.10

  data-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.data
    container_name: dtfs-lab-data-1
    # Named volumes are root-owned; lab runs as root so disk UUID + dirs work.
    user: "0:0"
    volumes:
      - ./configs/data-1.toml:/etc/dtfs/data.toml:ro
      - lab-data1-ssd:/mnt/ssd-a
      - lab-data1-hdd:/mnt/hdd-a
    ports:
      - "9500:9500"
    networks:
      lab:
        ipv4_address: 10.10.1.20
    depends_on:
      - mgr-1

  data-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.data
    container_name: dtfs-lab-data-2
    user: "0:0"
    volumes:
      - ./configs/data-2.toml:/etc/dtfs/data.toml:ro
      - lab-data2-ssd:/mnt/ssd-a
      - lab-data2-hdd:/mnt/hdd-a
    ports:
      - "9501:9500"
    networks:
      lab:
        ipv4_address: 10.10.1.21
    depends_on:
      - mgr-1

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24

volumes:
  lab-mgr1-data:
  lab-data1-ssd:
  lab-data1-hdd:
  lab-data2-ssd:
  lab-data2-hdd:
