[node]
id = "auto"
hostname = "data-4"
data_dir = "/var/lib/dtfs/data"

[location]
region = "eu"
datacenter = "paris"
rack = "rack-c1"
host = "data-4"

[cluster]
manager_addr = "10.10.3.10:9401"
shared_secret = "dev-cluster-secret-change-me"

[grpc]
listen_addr = "0.0.0.0:9500"

[tls]
mode = "auto"

[[disks]]
path = "/mnt/hdd-a"
tier = "cold"

[[disks]]
path = "/mnt/hdd-b"
tier = "cold"

[cache]
max_memory_mb = 1024
policy = "arc"

[scrub]
quick_interval_hours = 6
deep_interval_hours = 168
max_io_percent = 10
