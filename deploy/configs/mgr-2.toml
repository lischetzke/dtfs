[node]
id = "auto"
hostname = "mgr-2"
data_dir = "/var/lib/dtfs/manager"

[location]
region = "eu"
datacenter = "amsterdam"
rack = "rack-b1"
host = "mgr-2"

[cluster]
name = "dtfs-dev"
shared_secret = "dev-cluster-secret-change-me"
bootstrap = false
initial_voters = [
  { hostname = "mgr-1", addr = "mgr-1:9401" },
  { hostname = "mgr-2", addr = "mgr-2:9401" },
  { hostname = "mgr-3", addr = "mgr-3:9401" },
]

[raft]
listen_addr = "0.0.0.0:9400"

[grpc]
listen_addr = "0.0.0.0:9401"

[api]
listen_addr = "0.0.0.0:9402"

[tls]
mode = "auto"

[defaults]
chunk_size_mb = 4

[defaults.write_safety]
min_replicas_before_ack = 2
write_timeout_secs = 30

[defaults.replication]
hot = 3
warm = 2
cold = 1

[tiering]
enabled = true

[monitoring]
