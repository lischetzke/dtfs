[node]
id = "auto"
hostname = "data-1"
data_dir = "/var/lib/dtfs/data"

[location]
region = "eu"
datacenter = "frankfurt"
rack = "rack-a1"
host = "data-1"

[cluster]
manager_addr = "10.10.1.10:9401"
shared_secret = "dev-cluster-secret-change-me"

[grpc]
listen_addr = "0.0.0.0:9500"

[tls]
mode = "auto"

[[disks]]
path = "/mnt/ssd-a"
tier = "hot"

[[disks]]
path = "/mnt/hdd-a"
tier = "cold"

[cache]
max_memory_mb = 2048
policy = "arc"

[scrub]
quick_interval_hours = 6
deep_interval_hours = 168
max_io_percent = 10

# AZ-5 — source for `dtfs-cli update` (read by the CLI; the daemon
# ignores the block). Both keys are optional; the defaults shown are
# used when the block is absent.
[updater]
repo_url    = "https://github.com/lischetzke/dtfs"
install_dir = "/usr/local/bin"
