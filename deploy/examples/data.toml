# dtfs-data example configuration — /etc/dtfs/data.toml
#
# Canonical, exhaustive reference: every option the binary understands.
# Required options are set; optional options are commented out and show
# their compiled-in default. Source of truth: crates/dtfs-common/src/config.rs
# (DataNodeConfig). Keep this file in sync with that struct in the same commit
# (CLAUDE.md § B.6).

[node]
# hostname is this data node's IDENTITY: node_id = hash(hostname). MUST be
# unique across every daemon in the cluster — in particular it must differ
# from a co-located manager's [node].hostname and from a co-located FUSE
# client's [location].host (the client registers under that string).
hostname = "dtfs-example-data01"
#id = "auto"
#data_dir = "/var/lib/dtfs"

[location]
# Same region/datacenter/rack/host as other daemons on the same physical box
# so reads prefer the local replica. All four fields required.
region = "eu"
datacenter = "example-dc"
rack = "box1"
host = "example-box1"

[cluster]
manager_addr = "10.0.0.1:9401"      # primary manager gRPC endpoint
shared_secret = "change-me"         # same secret as the managers; empty is
                                    # refused at startup unless
                                    # allow_insecure_empty_secret = true (LIS-55).
#allow_insecure_empty_secret = false # lab-only: permit empty shared_secret
                                    # (Put/Delete/ReplicateChunk auth skip).
# Fallback managers, walked in order when the primary is unreachable (F-024).
# List every manager here so a rolling manager restart never strands the node.
#manager_addrs = ["10.0.0.2:9401", "10.0.0.3:9401"]

[grpc]
listen_addr = "10.0.0.4:9500"       # chunk-streaming gRPC. Use the ROUTABLE
                                    # address other nodes dial, not 0.0.0.0,
                                    # if the host has several interfaces.
#max_message_size_mb = 256
#max_concurrent_chunk_writes = 8    # Bug D: bounds peak put memory
                                    # (N in-flight writes x chunk size)

[tls]
# CF-6: mutual TLS for the data gRPC listener + outbound replication and
# manager connections. Semantics identical to manager.toml: "auto" (default)
# = TLS only when all three files exist on disk, else plaintext.
#mode = "auto"                      # "auto" | "require" | "disabled"
#cert_file = "/etc/dtfs/tls/server.crt"
#key_file = "/etc/dtfs/tls/server.key"
#ca_file = "/etc/dtfs/tls/ca.crt"

# One block per local disk. tier: "hot" | "warm" | "cold" | "tape".
[[disks]]
path = "/mnt/hdd0"
tier = "cold"

#[[disks]]
#path = "/mnt/ssd0"
#tier = "warm"

# REV-4-5 — INERT for the data role. The in-memory ARC chunk cache is not wired
# into the read path (every GetChunk streams from disk in pieces, § A.3.2), so
# these keys are parsed for back-compat and have no effect. They also no longer
# consume the memory budget: before REV-4-5 the phantom 8 GB default was
# subtracted when sizing put_chunk slots and collapsed write concurrency to a
# single slot on a memory-capped node. Client-side read caching is the FUSE
# local disk cache (`local_cache_dir` in fuse.toml).
[cache]
#max_memory_mb = 8192               # inert
#policy = "arc"                     # inert

[scrub]
# Local fallback only — the manager's [scrub] (ClusterScrubConfig) overrides
# these via heartbeat once connected.
#quick_interval_hours = 6
#deep_interval_hours = 168
#quick_cron = "0 3 * * *"           # optional cron override of the interval
#deep_cron = "0 4 * * 0"
#max_io_percent = 10
#verify_on_read = true              # startup fallback before first heartbeat
#quarantine_on_fault = true
# CR-6-3: internal, set by the manager's heartbeat ScrubConfigOverride, not
# meant to be hand-set here. 0 = unused, falls back to *_interval_hours.
#quick_interval_secs = 0
#deep_interval_secs = 0

# Optional sections below — whole block may be omitted.

#[memory]
# Bug G: per-process RAM budget with proactive backpressure. 0 = unbounded
# (legacy). Set non-zero on every production deploy; on a composite host the
# sum of all roles' caps must stay under host RAM (CLAUDE.md § A.5).
#hard_cap_mb = 0
#warn_threshold_pct = 80
#shed_threshold_pct = 92            # above this, new put_chunk -> RESOURCE_EXHAUSTED
#sample_interval_secs = 5

#[placement]
# Bug BU: reject writes to a disk under free-space headroom (typed
# RESOURCE_EXHAUSTED) instead of streaming into ENOSPC.
#min_free_bytes = 1073741824
#min_free_pct = 5.0
#allow_capacity_spill = true

#[updater]
# AZ-5: read by `dtfs-cli update` only; the daemon ignores this block.
# repo_url is a GitLab project URL (default) or a github.com repo. token is
# needed for a private GitLab project: deploy token (gldt-..., scope
# read_package_registry) or access token (glpat-..., scope read_api).
#repo_url = "https://github.com/lischetzke/dtfs"
#token = ""
# Minisign public key the release SHA256SUMS must be signed with (empty =
# unverified, warning printed). Env DTFS_MINISIGN_PUBKEY overrides.
#minisign_public_key = ""
#install_dir = "/usr/local/bin"

# LTFS-backed tape devices (frozen/archival tier). Omit if no tape drives.
#[[tape_devices]]
#ltfs_path = "/mnt/tape-a"          # must be LTFS-mounted before dtfs-data starts
#device = "/dev/nst0"               # raw drive node (status/rewind); optional
#library_device = "/dev/sg2"        # robotic changer; omit for standalone drive
#label = "lto9-library-a"
#capacity_gb = 18000                # informational hint (LTO-9 native ~18 TB)
#max_write_mbps = 0                 # 0 = unlimited tiering write bandwidth
