# dtfs-fuse example configuration — /etc/dtfs/fuse.toml
#
# Canonical, exhaustive reference: every option the binary understands.
# Required options are set; optional options are commented out and show
# their compiled-in default. Source of truth: crates/dtfs-common/src/config.rs
# (FuseConfig). Keep this file in sync with that struct in the same commit
# (AGENTS.md § B.6).
#
# NOTE: a config that fails to parse (syntax error, missing required field)
# makes the service exit at startup — under systemd that is a restart loop.
# Validate after editing: journalctl -u dtfs-fuse@<mount> -n 20.

[client]
manager_addr = "10.0.0.1:9401"      # primary manager gRPC endpoint
# Fallback managers, walked in order on failover (F-024).
#manager_addrs = ["10.0.0.2:9401", "10.0.0.3:9401"]
#shared_secret = ""                 # Bug AA: cluster secret. Required for the
                                    # client to self-register and appear in the
                                    # node table; empty = legacy invisible mode.
#heartbeat_interval_secs = 10       # Bug BQ-1: keepalive re-register cadence.
                                    # Keep well under raft.node_liveness_secs
                                    # (default 30). 0 = register once (flaps Down).
#chunk_size_mb = 4                  # Bug BW: MUST match the volume chunk size
                                    # (manager defaults.chunk_size_mb). Mismatch
                                    # corrupts multi-chunk reads.

[location]
# region/datacenter/rack: real topology of this client (drives nearest-replica
# read routing). host: the client's REGISTRY IDENTITY — dtfs-fuse has no
# [node].hostname; it registers under location.host. It must therefore be
# unique cluster-wide: never reuse a data node's or manager's hostname.
# Convention for a client co-located with a data node: "<data-hostname>_cln".
# Cost: the "_cln" suffix loses the SameHost distance tie-break; give each
# physical box its own rack value so SameRack keeps reads local.
region = "eu"
datacenter = "example-dc"
rack = "box1"
host = "dtfs-example-data01_cln"

[mount]
mountpoint = "/mnt/dtfs"
#allow_other = false                # F-028: let non-root users (e.g. Plex)
                                    # read/write through the mount

[readahead]
#mode = "folder-sequential"         # "folder-sequential" | "file-sequential" |
                                    # "file-only" | "disabled"
#prefetch_chunks = 8
#prefetch_next_files = 3
#cache_mb = 64                      # Bug CE: byte budget for the in-memory
                                    # prefetch cache (eviction, not a hard fail)

[cache]
# Local on-disk read cache (P0-11). Omit local_cache_dir to disable.
#local_cache_dir = "/var/cache/dtfs"
#local_cache_max_gb = 50
#max_age_days = 90                  # unset = size-based eviction only
#prune_interval_secs = 3600

[partition_safety]
#mode = "strict"                    # "strict" | "localreadonly" | "fulllock"
#quorum_loss_timeout_secs = 10
#show_warning = true

#[write]
# Bug AV (AV-3-1): first-write chunk placement preference.
#first_write_tier = "cold"          # "cold": ACK after the mandatory/anchor
                                    # tier holds the chunk (safe, slower).
                                    # "nearest-warm": ACK on a warm replica,
                                    # anchor copy follows asynchronously.
