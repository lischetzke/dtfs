# dtfs-fuse example configuration — /etc/dtfs/fuse.toml
#
# Canonical, exhaustive reference: every option the binary understands.
# Required options are set; optional options are commented out and show
# their compiled-in default. Source of truth: crates/dtfs-common/src/config.rs
# (FuseConfig). Keep this file in sync with that struct in the same commit
# (CLAUDE.md § B.6).
#
# NOTE: a config that fails to parse (syntax error, missing required field)
# makes the service exit at startup — under systemd that is a restart loop.
# Validate after editing: journalctl -u dtfs-fuse@<mount> -n 20.

# U4: ordered read-location preference. When set, reads pick the first replica
# whose datacenter OR host matches the earliest-listed entry (case-insensitive),
# taking precedence over raw physical distance. Falls through to distance (then
# a warm-over-cold tier tie-break) when no entry matches. Default: empty list =
# distance-only. Top-level key: it must precede the first [table] header.
#read_location_priority = ["dc1", "dc3"]

[client]
manager_addr = "10.0.0.1:9401"      # primary manager gRPC endpoint
# Fallback managers, walked in order on failover (F-024).
#manager_addrs = ["10.0.0.2:9401", "10.0.0.3:9401"]
#shared_secret = ""                 # Bug AA: cluster secret. Required for the
                                    # client to self-register and appear in the
                                    # node table; empty = legacy invisible mode.
#heartbeat_interval_secs = 10       # Bug BQ-1: keepalive re-register cadence.
                                    # Keep well under raft.node_liveness_secs
                                    # (default 30). 0 = register once (flaps Down).
#chunk_size_mb = 4                  # 1..=64 (startup refuses others).
                                    # Bug BW: MUST match the volume chunk size
                                    # (manager defaults.chunk_size_mb). Mismatch
                                    # corrupts multi-chunk reads.
#volume_id = ""                    # Volume new files/dirs of this mount are created in.
                                    # Empty = manager default volume. Must exist on the
                                    # manager (else create fails NotFound); only [A-Za-z0-9._-].
                                    # Set chunk_size_mb to that volume's chunk size.
#chunk_read_timeout_secs = 60       # FUSE-HOL: per-replica chunk-fetch timeout.
                                    # A hung/dead node that never errors would
                                    # otherwise stall the read forever; on timeout
                                    # the read fails over to the next replica.
                                    # 0 = disabled (unbounded). Raise for very
                                    # large chunks on very slow links.
#max_message_size_mb = 256          # CMN-3: max gRPC message size for the
                                    # client's manager + data-node channels.
                                    # Must be >= the manager/data-node [grpc]
                                    # max_message_size_mb. Must be > 0.

[location]
# region/datacenter/rack: real topology of this client (drives nearest-replica
# read routing). host: the client's REGISTRY IDENTITY — dtfs-fuse has no
# [node].hostname; it registers under location.host. It must therefore be
# unique cluster-wide: never reuse a data node's or manager's hostname.
# Convention for a client co-located with a data node: "<data-hostname>_cln".
# Cost: the "_cln" suffix loses the SameHost distance tie-break; give each
# physical box its own rack value so SameRack keeps reads local.
region = "eu"
datacenter = "example-dc"
rack = "box1"
host = "dtfs-example-data01_cln"

[mount]
mountpoint = "/mnt/dtfs"
#allow_other = false                # F-028: let non-root users (e.g. Plex)
                                    # read/write through the mount

[readahead]
#mode = "folder-sequential"         # "folder-sequential" | "file-sequential" |
                                    # "file-only" | "disabled"
#prefetch_chunks = 8
#prefetch_next_files = 3
#cache_mb = 64                      # Bug CE: byte budget for the in-memory
                                    # prefetch cache (eviction, not a hard fail)
#prefetch_max_inflight = 2          # WI-05: cap on concurrent prefetch GetChunk
                                    # streams; keeps the near chunk from starving
                                    # on slow links (e.g. the 40 Mbps LELI link)

[cache]
# Local on-disk read cache (P0-11). Omit local_cache_dir to disable.
#local_cache_dir = "/var/cache/dtfs"
#local_cache_max_gb = 50
#max_age_days = 90                  # unset = size-based eviction only
#prune_interval_secs = 3600

[partition_safety]
#quorum_loss_timeout_secs = 10      # validated only; not acted on at runtime

#[tls]
# CF-6: gRPC transport security toward managers and data nodes (mutual TLS
# against the cluster CA). "auto" (default) enables TLS only when all three
# files below are configured AND exist on disk — otherwise the client stays
# plaintext, so a cert-less config keeps working. "require" fails startup
# without them; "disabled" forces plaintext. Enable only after every manager
# and data node runs a TLS-capable build (docs/src/security/tls.md).
#mode = "auto"                      # "auto" | "require" | "disabled"
#cert_file = "/etc/dtfs/tls/client.crt"
#key_file = "/etc/dtfs/tls/client.key"
#ca_file = "/etc/dtfs/tls/ca.crt"

#[write]
# Bug AV (AV-3-1): first-write chunk placement preference.
#first_write_tier = "cold"          # "cold": ACK after the mandatory/anchor
                                    # tier holds the chunk (safe, slower).
                                    # "nearest-warm": ACK on a warm replica,
                                    # anchor copy follows asynchronously.
                                    # Either way the manager adds targets on
                                    # other maintained tiers until
                                    # min_replicas_before_ack nodes hold it.
# WI-01: number of complete chunks the write buffer holds back before
# flushing, amortizing the AllocateChunks + CommitChunkLocations round trip
# over a batch instead of firing once per chunk. Effective range 1..=64
# (values outside are clamped). Batch byte limit = max(64 MB, batch x
# 4 MB) capped at 256 MB, whatever the volume's chunk size (large chunks:
# fewer per batch); per-file dirty cap = max(128 MB, 2 x batch limit). Default 4 x 4 MB: 64 MB / 128 MB.
# 64 x 4 MB: 256 MB batch, 512 MB dirty cap PER OPEN WRITER; size the
# [memory] budget for dirty cap x open writers + readahead.cache_mb.
# 1 restores the pre-WI-01 per-chunk-flush behaviour exactly.
#flush_batch_chunks = 4
# Chunks of one flush batch uploaded concurrently (clamped 1..=64; 1 = one
# chunk at a time). Each in-flight chunk buffers about 3 MiB per target;
# on a slow WAN link keep it low so puts stay within the 60 s RPC timeout.
# Above 8 only for a data disk with slow fsync (NAS-backed), together with
# a matching flush_batch_chunks and the data node's
# grpc.max_concurrent_chunk_writes.
#upload_concurrency = 2
# true: every write uploads synchronously to the volume's anchor datacenter.
# false: each chunk goes to min_replicas_before_ack maintained nodes outside
# the anchor DC (any maintained tier, whatever first_write_tier says; anchor-DC
# nodes only when the others cannot reach the floor); the manager's repair
# copies the anchor replica later.
# Until then the chunk has >= floor copies but none in the anchor DC
# ("Catching up" on the dashboard). No effect for a client in the anchor DC.
#anchor_sync = true
# false: fsync and close(2) commit every buffered byte (default).
# true: fsync commits nothing extra; a partial chunk is committed when it
# fills, when its oldest byte is async_commit_secs old, under the per-file
# dirty cap (128 MB by default), or at close(2) (every close still commits). RISK: acknowledged writes can stay
# only in client memory for that window and are LOST if dtfs-fuse or the host
# crashes. Media / NFS re-export only.
#async_commit = false
# Max age of an uncommitted buffered byte with async_commit = true (1..=60,
# half the 120 s write lease).
#async_commit_secs = 30
# async_commit only: background batches of ONE file uploading at once
# (clamped 1..=16; 1 = one batch per file). Puts in flight per file = up to
# max_inflight_batches x min(upload_concurrency, flush_batch_chunks); the
# next batch starts while the slowest put of the previous one still runs.
# Per-file dirty cap becomes max(128 MB, (n + 1) x batch limit), e.g.
# 16 x 4 MB batches with n = 4: 320 MB PER OPEN WRITER.
# Put buffers come on top, outside the dirty cap and outside [memory]:
# about 3 MiB per put per target, i.e. puts in flight x replicas x 3 MiB
# (16/16/4 x 3 targets: 64 x 3 x 3 = 576 MiB; 1-replica volume: 192 MiB).
#max_inflight_batches = 1

#[memory]
# CF-5: per-process RAM budget + pressure ladder. 0 = unbounded (legacy).
# When non-zero, a background sampler watches RSS and, at the warn level,
# halves the [readahead] cache_mb prefetch budget; at the shed level it drops
# all unconsumed prefetch. With write.async_commit, the write buffers of all
# files together (buffered + uploading) are held to hard_cap_mb -
# readahead.cache_mb - hard_cap_mb / 4: a write over it waits for background
# batches (never while none is in flight). systemd MemoryHigh/MemoryMax stay the hard backstop;
# on a composite host the sum of all roles' caps must stay under host RAM
# (CLAUDE.md § A.5).
#hard_cap_mb = 0
#warn_threshold_pct = 80            # at/above this -> readahead budget halved
#shed_threshold_pct = 92            # at/above this -> drop unconsumed prefetch
#sample_interval_secs = 5

#[updater]
# AZ-5: read by `dtfs-cli update` only; the daemon ignores this block.
# repo_url must be a github.com repo (default below). token is an optional
# GitHub token (rate limits or a private fork), sent as a Bearer header.
#repo_url = "https://github.com/lischetzke/dtfs"
#token = ""
# Minisign public key the release SHA256SUMS must be signed with (empty =
# unverified, warning printed). Env DTFS_MINISIGN_PUBKEY overrides.
#minisign_public_key = ""
#install_dir = "/usr/local/bin"
