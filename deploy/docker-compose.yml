# DTFS Development Cluster
# Simulates a multi-DC deployment with 3 managers and 4 data nodes.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down -v

services:
  # --- Manager nodes (Raft cluster) ---

  mgr-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.manager
    container_name: dtfs-mgr-1
    volumes:
      - ./configs/mgr-1.toml:/etc/dtfs/manager.toml:ro
      - mgr1-data:/var/lib/dtfs/manager
    ports:
      - "9400:9400"   # Raft
      - "9401:9401"   # gRPC
      - "9402:9402"   # REST API + WebUI
    networks:
      dc-frankfurt:
        ipv4_address: 10.10.1.10

  mgr-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.manager
    container_name: dtfs-mgr-2
    volumes:
      - ./configs/mgr-2.toml:/etc/dtfs/manager.toml:ro
      - mgr2-data:/var/lib/dtfs/manager
    ports:
      - "9410:9400"
      - "9411:9401"
      - "9412:9402"
    networks:
      dc-amsterdam:
        ipv4_address: 10.10.2.10

  mgr-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.manager
    container_name: dtfs-mgr-3
    volumes:
      - ./configs/mgr-3.toml:/etc/dtfs/manager.toml:ro
      - mgr3-data:/var/lib/dtfs/manager
    ports:
      - "9420:9400"
      - "9421:9401"
      - "9422:9402"
    networks:
      dc-paris:
        ipv4_address: 10.10.3.10

  # --- Data nodes ---

  data-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.data
    container_name: dtfs-data-1
    volumes:
      - ./configs/data-1.toml:/etc/dtfs/data.toml:ro
      - data1-ssd:/mnt/ssd-a
      - data1-hdd:/mnt/hdd-a
    ports:
      - "9500:9500"
    networks:
      dc-frankfurt:
        ipv4_address: 10.10.1.20

  data-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.data
    container_name: dtfs-data-2
    volumes:
      - ./configs/data-2.toml:/etc/dtfs/data.toml:ro
      - data2-ssd:/mnt/ssd-a
      - data2-hdd:/mnt/hdd-a
    ports:
      - "9501:9500"
    networks:
      dc-frankfurt:
        ipv4_address: 10.10.1.21

  data-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.data
    container_name: dtfs-data-3
    volumes:
      - ./configs/data-3.toml:/etc/dtfs/data.toml:ro
      - data3-ssd:/mnt/ssd-a
      - data3-hdd:/mnt/hdd-a
    ports:
      - "9502:9500"
    networks:
      dc-amsterdam:
        ipv4_address: 10.10.2.20

  data-4:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.data
    container_name: dtfs-data-4
    volumes:
      - ./configs/data-4.toml:/etc/dtfs/data.toml:ro
      - data4-hdd-a:/mnt/hdd-a
      - data4-hdd-b:/mnt/hdd-b
    ports:
      - "9503:9500"
    networks:
      dc-paris:
        ipv4_address: 10.10.3.20

# --- Networks (simulated DCs) ---

networks:
  dc-frankfurt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
  dc-amsterdam:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24
  dc-paris:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.3.0/24

# --- Volumes ---

volumes:
  mgr1-data:
  mgr2-data:
  mgr3-data:
  data1-ssd:
  data1-hdd:
  data2-ssd:
  data2-hdd:
  data3-ssd:
  data3-hdd:
  data4-hdd-a:
  data4-hdd-b:
