[defaults]
# Every remote host is reached as root over SSH; no privilege escalation.
remote_user = root
host_key_checking = False
forks = 5
timeout = 30
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new
pipelining = True

[privilege_escalation]
become = False
